[package]
name = "holy"
description = "Proc-macro helpers: getters, setters, sanitisation and fuzzing derives."
version = "0.2.2"
authors = ["kbve", "h0lybyte"]
homepage = "https://kbve.com/"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# Compile-fail tests: the .stderr fixtures in tests/fail record exact rustc
# output, so this is pinned rather than tracked through the workspace table --
# a trybuild bump reformats diagnostics and rewrites every fixture.
trybuild = "1.0"
rand = { workspace = true }
