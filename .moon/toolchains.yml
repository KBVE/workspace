$schema: 'https://moonrepo.dev/schemas/toolchains.json'

# moon 2 splits the old monolithic node toolchain into discrete plugins:
# runtime (node), package manager (pnpm), ecosystem (javascript),
# type layer (typescript). Each must be registered here to be active.

node:
  version: '26.8.1'

pnpm:
  version: '11.24.0'

javascript:
  packageManager: 'pnpm'
  dedupeOnLockfileChange: true
  inferTasksFromScripts: false
  syncProjectWorkspaceDependencies: true
  dependencyVersionFormat: 'workspace'

typescript:
  # Project references are off on purpose. moon would write them from the
  # dependsOn graph, and TypeScript then requires composite: true on every
  # referenced project, which means declaration emit — something an Astro
  # project, which is noEmit, cannot provide. Resolution already works through
  # each package's exports map, so the references buy nothing here.
  syncProjectReferences: false
  createMissingConfig: false
  includeSharedTypes: false

rust:
  version: '1.98.0'
  # Both of these rewrite Cargo.toml on sync: the writer reformats the file,
  # drops the comments, and adds a member entry for every project it sees --
  # including gilded-gazette, which has no Cargo.toml and breaks the workspace.
  # rust-toolchain.toml is pinned by hand instead.
  syncToolchainConfig: false
  addMsrvConstraint: false
  components:
    - 'clippy'
    - 'rustfmt'
