$schema: 'https://moonrepo.dev/schemas/tasks.json'

# moon 2 scopes global tasks with `inheritedBy`, not by filename.
inheritedBy:
  toolchain: 'rust'

fileGroups:
  sources:
    - 'src/**/*'
  tests:
    - 'tests/**/*'
  manifests:
    - 'Cargo.toml'
    - '/Cargo.lock'

tasks:
  build:
    command: 'cargo build --release'
    # Generated code is an output of an upstream project, so it has to exist
    # before rustc runs. Without this the first build in a clean clone fails
    # on a missing include! path.
    deps: ['^:build']
    inputs: ['@group(sources)', '@group(manifests)']
  test:
    command: 'cargo test'
    deps: ['^:build']
    inputs: ['@group(sources)', '@group(tests)', '@group(manifests)']
  lint:
    command: 'cargo clippy --all-targets -- -D warnings'
    deps: ['^:build']
    inputs: ['@group(sources)', '@group(manifests)']
  format:
    command: 'cargo fmt --check'
    inputs: ['@group(sources)']
