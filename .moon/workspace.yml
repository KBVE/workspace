$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Project graph. Each glob entry expects a `moon.yml` in the matched directory.
projects:
  globs:
    # Apps are grouped by kind: apps/website/<domain>, apps/game/<name>.
    - 'apps/*/*'
    - 'services/*'
    - 'packages/*'
    - 'crates/*'
    - 'tools/*'

codeowners:
  # Ownership is declared per project in its moon.yml and synced here, so it
  # cannot drift from the project it describes.
  sync: true
  orderBy: 'file-source'
  globalPaths:
    # Repo-wide fallback: everything has an owner even before its project
    # declares one.
    '*': ['@h0lybyte']
    '/.github/': ['@h0lybyte']

vcs:
  defaultBranch: 'main'
  provider: 'github'
  # Generated into .moon/hooks and pointed at by core.hooksPath, so a fresh
  # clone is protected without anyone wiring it up.
  #
  # core.hooksPath replaces .git/hooks wholesale rather than adding to it, so
  # the Git LFS hooks have to be declared here too. Leaving them out silently
  # stops pre-push from uploading LFS objects: pointers push, blobs do not, and
  # the assets 404 for everyone else.
  sync: true
  hooks:
    pre-commit:
      - 'bash ./tools/hooks/pre-commit-crypt.sh'
    pre-push:
      - 'git lfs pre-push "$ARG1" "$ARG2"'
    post-checkout:
      - 'git lfs post-checkout "$ARG1" "$ARG2" "$ARG3"'
    post-commit:
      - 'git lfs post-commit'
    post-merge:
      - 'git lfs post-merge "$ARG1"'

hasher:
  optimization: 'accuracy'

pipeline:
  inheritColorsForPipedTasks: true
