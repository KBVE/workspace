$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Project graph. Each glob entry expects a `moon.yml` in the matched directory.
projects:
  globs:
    # Apps are grouped by kind: apps/website/<domain>, apps/game/<name>.
    - 'apps/*/*'
    # One glob per service group rather than 'services/*/*': the wide form
    # also matches node_modules and anything else a group happens to contain.
    # A new deploy target adds a line here.
    - 'services/api/*'
    - 'packages/*'
    # Python packages sit a level deeper, grouped by language the way apps are
    # grouped by kind. 'packages/*' is one level and does not reach them.
    - 'packages/python/*'
    - 'crates/*'
    - 'tools/*'
  sources:
    # windmill is a single project, not a group: the wmill CLI owns the tree
    # under f/, so there is nothing below it to glob.
    windmill: 'services/windmill'

codeowners:
  # Ownership is declared per project in its moon.yml and synced here, so it
  # cannot drift from the project it describes.
  sync: true
  orderBy: 'file-source'
  globalPaths:
    # Repo-wide fallback: everything has an owner even before its project
    # declares one.
    '*': ['@h0lybyte']
    '/.github/': ['@h0lybyte']

vcs:
  defaultBranch: 'main'
  provider: 'github'
  # Generated into .moon/hooks and pointed at by core.hooksPath, so a fresh
  # clone is protected without anyone wiring it up.
  #
  # core.hooksPath replaces .git/hooks wholesale rather than adding to it, so
  # the Git LFS hooks have to be declared here too. Leaving them out silently
  # stops pre-push from uploading LFS objects: pointers push, blobs do not, and
  # the assets 404 for everyone else.
  sync: true
  hooks:
    pre-commit:
      - 'bash ./tools/hooks/pre-commit.sh'
    pre-push:
      - 'git lfs pre-push "$ARG1" "$ARG2"'
    post-checkout:
      - 'git lfs post-checkout "$ARG1" "$ARG2" "$ARG3"'
      # Repairs the git-crypt filter config. `git-crypt unlock` rewrites it
      # back to a form that cannot resolve a key from inside a worktree, and
      # unlock does a checkout, so this fires on the way out of the very
      # command that broke it. Silent unless it actually changes something.
      - 'S="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/tools/worktree/setup.sh"; [ -x "$S" ] && bash "$S" --if-needed || true'
      # Warms a new worktree's Cargo target/ from the main checkout, so a
      # worktree created by something other than tools/worktree/add.sh -- an
      # agent's own isolation, a bare `git worktree add` -- is not born cold.
      # No-ops in the main checkout and whenever a target/ already exists.
      # Resolved against the main checkout, not the new worktree: the worktree
      # may sit at a commit that predates this script, and a relative path
      # would then silently do nothing.
      - 'S="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/tools/worktree/seed-target.sh"; [ -x "$S" ] && bash "$S" || true'
    post-commit:
      - 'git lfs post-commit'
    post-merge:
      - 'git lfs post-merge "$ARG1"'

hasher:
  optimization: 'accuracy'

pipeline:
  inheritColorsForPipedTasks: true

experiments:
  # Content-addressable store for task outputs. Required by the shared worktree
  # cache below -- that feature shares CAS blobs, so without this there is
  # nothing to share.
  casOutputsCache: true

cache:
  # Share task outputs across git worktrees.
  #
  # A linked worktree gets its own .moon/cache, so without this every worktree
  # an agent is given starts cold and re-runs builds whose outputs already sit
  # on this machine. Only blobs and manifests are shared -- they are portable.
  # Hashes, locks, and run states stay per-worktree, which is what keeps two
  # worktrees from reading each other's task state.
  #
  # The shared store lives in the base checkout's .moon/cache, already ignored.
  #
  # This is the moon-side half of tools/worktree/add.sh: that script handles
  # Cargo (own target/, copy-on-write seeded) and LFS (pointers, shared object
  # store), and this handles every other toolchain's task outputs.
  #
  # Still prefixed unstable_ in moon 2.5. The unprefixed spelling already
  # validates, so this becomes a rename to watch for rather than a rewrite.
  # MOON_CACHE_SHARED_WORKTREE_CACHE overrides it per run;
  # cache.cas.maxSize and cache.cas.verifyIntegrity tune the store itself.
  unstable_sharedWorktreeCache: true
