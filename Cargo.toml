[workspace]
resolver = "3"
# Services are grouped by deploy target. Only the container-deployed group is
# Rust, so the glob names it: a services/*/* form would match the TypeScript
# groups and fail on their missing manifests.
members = ["services/api/*", "crates/*", "apps/arcade/*"]
# gilded-gazette is a Godot/TypeScript project that happens to sit under
# apps/arcade, so the glob picks it up and cargo then fails on the missing
# manifest. Excluding it keeps the glob rather than listing every game.
exclude = [
    "apps/arcade/gilded-gazette",
    # fish-and-chip is TypeScript. Non-Rust games under apps/arcade are turning
    # out to be the norm rather than the exception, so this list will keep
    # growing -- naming the Rust crates explicitly may end up cleaner than a
    # glob plus a lengthening set of exclusions.
    "apps/arcade/fish-and-chip",
    # windmill is a Node service, so services/*/* matches its subdirectories --
    # node_modules, tools -- and cargo hard-errors on any member whose manifest
    # it cannot read. Excluding the service covers all of them.
    "services/windmill",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/KBVE/workspace"

[workspace.dependencies]
# Pin shared crate versions here so every service moves together.
axum = "0.8.9"
prost = "0.14.1"
# The schemas use google.protobuf.Timestamp and Struct, so the well-known types
# have to be in scope for the generated tree to compile.
prost-types = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Bevy is unusably slow in a debug build unless the engine itself is optimised.
# Optimising dependencies only keeps our own crates fast to rebuild while the
# renderer still runs at a real frame rate. Profiles are only read from the
# workspace root -- cargo ignores them in member manifests.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
