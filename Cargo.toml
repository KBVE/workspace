[workspace]
resolver = "3"
# Services are grouped by deploy target. Only the container-deployed group is
# Rust, so the glob names it: a services/*/* form would match the TypeScript
# groups and fail on their missing manifests.
members = ["services/api/*", "crates/*", "apps/arcade/*"]
# gilded-gazette is a Godot/TypeScript project that happens to sit under
# apps/arcade, so the glob picks it up and cargo then fails on the missing
# manifest. Excluding it keeps the glob rather than listing every game.
exclude = [
    "apps/arcade/gilded-gazette",
    # fish-and-chip is TypeScript. Non-Rust games under apps/arcade are turning
    # out to be the norm rather than the exception, so this list will keep
    # growing -- naming the Rust crates explicitly may end up cleaner than a
    # glob plus a lengthening set of exclusions.
    "apps/arcade/fish-and-chip",
    # windmill is a Node service, so services/*/* matches its subdirectories --
    # node_modules, tools -- and cargo hard-errors on any member whose manifest
    # it cannot read. Excluding the service covers all of them.
    "services/windmill",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/KBVE/workspace"

[workspace.dependencies]
# Pin shared crate versions here so every service moves together.
axum = "0.8.9"
prost = "0.14.1"
# The schemas use google.protobuf.Timestamp and Struct, so the well-known types
# have to be in scope for the generated tree to compile.
prost-types = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Proc-macro crates. syn 3 is a breaking change from 2 and the derives in
# `holy` are written against it, so this is a floor rather than a preference.
proc-macro2 = "1"
quote = "1.0.44"
syn = "3"
rand = "0.10"

# Brought over with `jedi`. Several are only reachable through its optional
# features (postgres, grpc, valkey, aws), but cargo still needs a version for
# an optional dependency, so they are all declared here.
ammonia = "4.1.2"
async-trait = "0.1.88"
bb8 = "0.9"
bitflags = "2.9.0"
bytes = "1"
chrono = { version = "0.4.44", default-features = false }
dashmap = "6.1.0"
futures-util = { version = "0.3", default-features = false }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lru = "0.18"
metrics = "0.24"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2"
serial_test = "3"
thiserror = "2.0.12"
tokio-postgres = "0.7.2"
tonic = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tower = "0.5.3"
ulid = "1.2.1"
url = "2.5"
uuid = "1"
webpki-roots = "1.0"

# Brought over with `erust`.
base64 = "0.22.1"
log = "0.4"
wasm-bindgen-futures = "0.4"

# Brought over with the `kbve` crate.
anyhow = "1.0"
argon2 = "0.5.0"
askama = "0.16.0"
axum-extra = "0.12.6"
dotenvy = "0.15"
tokio-tungstenite = { version = "0.29", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Bevy is unusably slow in a debug build unless the engine itself is optimised.
# Optimising dependencies only keeps our own crates fast to rebuild while the
# renderer still runs at a real frame rate. Profiles are only read from the
# workspace root -- cargo ignores them in member manifests.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
