[workspace]
resolver = "3"
# Services are grouped by kind: services/api/<name>.
members = ["services/*/*", "crates/*", "apps/arcade/*"]
# gilded-gazette is a Godot/TypeScript project that happens to sit under
# apps/arcade, so the glob picks it up and cargo then fails on the missing
# manifest. Excluding it keeps the glob rather than listing every game.
exclude = ["apps/arcade/gilded-gazette"]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/KBVE/workspace"

[workspace.dependencies]
# Pin shared crate versions here so every service moves together.
axum = "0.8.9"
prost = "0.14.1"
# The schemas use google.protobuf.Timestamp and Struct, so the well-known types
# have to be in scope for the generated tree to compile.
prost-types = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
