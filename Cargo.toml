[workspace]
resolver = "3"
members = ["services/*", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/KBVE/workspace"

[workspace.dependencies]
# Pin shared crate versions here so every service moves together.
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
