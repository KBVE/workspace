packages:
  - 'apps/*/*'
  - 'packages/*'
  - 'services/*'
  - 'tools/*'

# One version per dependency for the whole workspace. Projects declare what
# they use and write `catalog:` instead of a version, so two sites cannot
# drift onto different Astro releases.
catalog:
  astro: 7.2.8
  '@astrojs/check': 0.9.4
  '@astrojs/mdx': 7.0.8
  '@astrojs/sitemap': 3.7.3
  typescript: 5.9.3
  windmill-cli: 1.798.1
  # Phaser + React game stack (apps/arcade/fish-and-chip).
  phaser: 4.2.1
  grid-engine: 2.52.1
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@vitejs/plugin-react': 6.1.0
  vite: 8.2.2
  vitest: 4.1.11
  jsdom: 30.0.1
  '@testing-library/react': 16.3.2
  '@testing-library/dom': 10.4.1
  nanostores: 1.5.2
  '@nanostores/persistent': 1.3.5
  '@playwright/test': 1.62.1
  sharp: 0.35.4
  # @kbve/laser's peer set (packages/laser). Every one of these is an optional
  # peer of the published package: laser splits its entry points so a consumer
  # that only wants the ECS never has to install three. They are pinned here
  # because the e2e fixture and the unit tests do install all of them.
  three: 0.185.1
  '@types/three': 0.185.3
  '@react-three/fiber': 9.7.0
  '@react-three/drei': 10.7.8
  bitecs: 0.4.0
  '@phaserjs/rapier-connector': 1.0.2
  fastnoise-lite: 1.1.1
  vite-plugin-dts: 4.5.4
  # laser's entry-point guard reads its own sources off disk with node:fs.
  '@types/node': 24.10.1

# grid-engine 2.52.1 declares `phaser: ~4.0.0`, which was the current release
# when it was published. Phaser 4.1 and 4.2 changed nothing grid-engine calls,
# so the game runs on the newest Phaser and this states that on purpose --
# without it every install prints an unmet-peer warning that trains people to
# ignore the ones that matter. Drop this line when grid-engine widens its peer.
peerDependencyRules:
  allowedVersions:
    'grid-engine>phaser': '4'

# pnpm 11 blocks postinstall scripts by default. These fetch platform
# binaries, so they have to be allowed explicitly.
allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  sharp: true

# sharp ships one prebuilt binary per platform, all published in the same
# minute as the parent release, so the release-age policy rejects the whole
# set. Excluding them trusts the sharp publisher rather than the delay.
minimumReleaseAgeExclude:
  - astro@7.2.8
  - sharp@0.35.4
  - '@img/sharp-darwin-arm64@0.35.4'
  - '@img/sharp-darwin-x64@0.35.4'
  - '@img/sharp-freebsd-wasm32@0.35.4'
  - '@img/sharp-linux-arm64@0.35.4'
  - '@img/sharp-linux-arm@0.35.4'
  - '@img/sharp-linux-ppc64@0.35.4'
  - '@img/sharp-linux-riscv64@0.35.4'
  - '@img/sharp-linux-s390x@0.35.4'
  - '@img/sharp-linux-x64@0.35.4'
  - '@img/sharp-linuxmusl-arm64@0.35.4'
  - '@img/sharp-linuxmusl-x64@0.35.4'
  - '@img/sharp-wasm32@0.35.4'
  - '@img/sharp-webcontainers-wasm32@0.35.4'
  - '@img/sharp-win32-arm64@0.35.4'
  - '@img/sharp-win32-ia32@0.35.4'
  - '@img/sharp-win32-x64@0.35.4'
  - '@img/sharp-libvips-darwin-arm64@1.3.3'
  - '@img/sharp-libvips-darwin-x64@1.3.3'
  - '@img/sharp-libvips-linux-arm64@1.3.3'
  - '@img/sharp-libvips-linux-arm@1.3.3'
  - '@img/sharp-libvips-linux-ppc64@1.3.3'
  - '@img/sharp-libvips-linux-riscv64@1.3.3'
  - '@img/sharp-libvips-linux-s390x@1.3.3'
  - '@img/sharp-libvips-linux-x64@1.3.3'
  - '@img/sharp-libvips-linuxmusl-arm64@1.3.3'
  - '@img/sharp-libvips-linuxmusl-x64@1.3.3'
  - windmill-cli@1.798.1
