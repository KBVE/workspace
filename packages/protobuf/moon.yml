# The single source of truth for every wire type in the workspace. Consumers
# depend on this project, so touching a .proto invalidates their builds too.
layer: 'library'
language: 'unknown'
stack: 'systems'
tags: ['proto']

owners:
  defaultOwner: '@h0lybyte'
  # Schema changes fan out to every consumer and are breaking by default.
  paths:
    # The shared layers are imported by every domain: a change here is a
    # change to all of them.
    'kbve/type/': ['@h0lybyte']
    'kbve/common/': ['@h0lybyte']
    'buf.yaml': ['@h0lybyte']
    'buf.gen.yaml': ['@h0lybyte']

tasks:
  # Named build so '^:build' from a consumer pulls generation in.
  build:
    command: 'buf generate'
    toolchains: ['node']
    inputs:
      - 'kbve/**/*.proto'
      - 'buf.gen.yaml'
      - 'buf.yaml'
    outputs:
      - 'gen/**/*'

  # Runs in the moon graph rather than in a workflow: it needs no secrets and
  # no toolchain buf does not already bring, so a path filter in YAML would
  # only be restating the inputs below.
  verify-gen:
    command: 'bash tools/verify-gen.sh'
    toolchains: ['node']
    deps: ['~:build']
    inputs:
      - 'kbve/**/*.proto'
      - 'buf.gen.yaml'
      - 'tools/verify-gen.sh'

  lint:
    command: 'buf lint'
    toolchains: ['node']
    inputs: ['kbve/**/*.proto', 'buf.yaml']

  format:
    command: 'buf format --diff --exit-code'
    toolchains: ['node']
    inputs: ['kbve/**/*.proto']

  # DISABLED UNTIL PUBLICATION. Re-enable before the first `buf push`.
  #
  # Nothing consumes these schemas yet, so breaking changes are not only
  # allowed but the point: retiring kbve/schema.proto deletes messages, and
  # folding the per-domain rarity and element enums into common changes field
  # types. This check would fail every one of those pull requests.
  #
  # The moment a consumer pins a published version that stops being true, and
  # this becomes the most important task in the file. Uncommenting it is the
  # last step before publishing, not an afterthought -- protobuf-publish.yml
  # greps for an active `breaking:` task here and refuses to push without one.
  #
  # The command is verified working: against origin/main it rejects a deleted
  # field and a changed field type, and accepts an added field. It resolves a
  # git ref, so it needs the full clone ci.yml already checks out.
  #
  # breaking:
  #   command: 'buf breaking --against .git#branch=origin/main'
  #   toolchains: ['node']
  #   inputs: ['kbve/**/*.proto', 'buf.yaml']
