[project]
name = "fudster"
version = "2.0.0"
description = "Fudster - API, browser automation and Claude tooling built on kbve"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.14,<3.15"

# kbve[server] rather than kbve: the CLI reaches kbve.grpc.client,
# kbve.grpc.compiler and kbve.health, all of which live behind that extra since
# the server stack stopped being a base dependency. Asking for bare kbve here
# would install cleanly and fail at `fudster grpc health`.
dependencies = [
    "kbve[server]",
    # Declared even though kbve[server] also brings them: fudster.api imports
    # fastapi and aiohttp at module scope, and depending on another package's
    # dependency list to keep supplying them is how an install breaks on an
    # unrelated change over there.
    "fastapi>=0.115,<1.0",
    "aiohttp>=3.9,<4.0",
    "pydantic>=1.10,<3.0",
    "broadcaster>=0.3,<1.0",
    "jinja2>=3.0,<4.0",
    "requests>=2.28,<3.0",
    "anyio>=4.0,<5.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<6.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
# Screen and input control (fudster.apps.screen_client, chrome_client).
automation = [
    "opencv-python>=4.9,<5.0",
    "pyautogui>=0.9,<1.0",
    "humancursor>=1.1,<2.0",
    "pillow>=10.0,<12.0",
    "numpy>=1.26,<3.0",
]
browser = [
    "seleniumbase>=4.32,<5.0",
]
ocr = [
    "pytesseract>=0.3.10,<1.0",
    "pillow>=10.0,<12.0",
]
vnc = [
    "websockify>=0.11,<1.0",
    "websockets>=12.0",
]

[project.scripts]
fudster = "fudster.cli:main"

[dependency-groups]
# Ranges, not == pins. uv.lock is what makes a sync reproducible; pinning here
# as well is what stopped kbve's toolchain moving to 3.14 without an edit.
dev = [
    "autopep8>=2.0,<3.0",
    "flake8>=7.1,<9.0",
    "pytest>=8.3,<10.0",
    "pytest-sugar>=1.0,<2.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    # Two grpc compile tests skip without it. A skipped test that nobody
    # notices is worse than a missing one.
    "grpcio-tools>=1.62,<2.0",
]

[tool.coverage.run]
branch = true
source = [ "fudster" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
# Project-relative. Upstream wrote these to '../../../coverage/...', which only
# resolves at one nesting depth and puts the artifacts outside the project moon
# declares them as outputs of.
addopts = "--cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml"

[tool.hatch.build.targets.wheel]
packages = ["fudster"]

# The workspace copy, not a registry release. kbve is unpublished at 2.0.0 and
# the two move together.
[tool.uv.sources]
kbve = { path = "../kbve", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
