# The `kbve` PyPI package, ported from the legacy Nx workspace at
# KBVE/kbve packages/python/kbve.
#
# The id is not the directory name. `crates/kbve` already owns `kbve` in the
# project graph, and two projects cannot share an id -- but only the graph
# cares. The directory, the distribution name, and `pip install kbve` all stay
# `kbve`; the crate and the wheel live in different registries and never meet.
# The visible consequence is the release tag: `kbve-py@2.0.0`, which is also
# what keeps it unambiguous against a future tag for the crate.
id: 'kbve-py'
layer: 'library'
language: 'python'
# Not 'backend', which is what this was and what the server stack still is.
# That stack is an optional extra now: what `pip install kbve` gives you is the
# SEO auditor, the ArgoCD annotation passes and the Unreal compile-database
# tooling. The base install is infrastructure tooling, so the stack says so.
stack: 'infrastructure'

# Descriptive for now, the way 'proto' is on packages/protobuf: no
# .moon/tasks/pypi.yml exists yet, so nothing is inherited from it. It is here
# so the project is discoverable by `moon query projects --tag pypi` alongside
# the npm and itch publishers, and so the publish task set has something to
# attach to when release plumbing lands.
tags: ['pypi']

owners:
  defaultOwner: '@h0lybyte'

fileGroups:
  sources:
    - 'kbve/**/*'
  tests:
    - 'tests/**/*'
  manifests:
    - 'pyproject.toml'
    - 'uv.lock'
    # uv resolves the interpreter from this, so changing it changes every venv
    # built from these manifests. Left out, a Python bump would not re-sync.
    - '.python-version'

tasks:
  # moon 2.5 has no built-in python toolchain plugin -- declaring `python:` in
  # .moon/toolchains.yml fails with "a locator is required for plugins". The
  # interpreter and uv are pinned in .prototools instead, so these run as
  # system commands against proto-managed binaries.
  install:
    # --all-extras because the test suite imports every module, including the
    # ones behind server and blender. A consumer that only wants kbve.seo
    # installs neither, which is the point of the split.
    command: 'uv sync --all-extras --dev'
    toolchains: ['system']
    inputs: ['@group(manifests)']
    options:
      # The output is a .venv full of absolute paths; nothing portable to cache.
      cache: false

  test:
    command: 'uv run pytest tests/'
    toolchains: ['system']
    deps: ['~:install']
    inputs: ['@group(sources)', '@group(tests)', '@group(manifests)']
    outputs: ['reports']

  lint:
    command: 'uv run flake8 kbve tests'
    toolchains: ['system']
    deps: ['~:install']
    inputs: ['@group(sources)', '@group(tests)', '.flake8']

  build:
    command: 'uv build --out-dir dist'
    toolchains: ['system']
    deps: ['~:install']
    inputs: ['@group(sources)', '@group(manifests)', 'README.md']
    outputs: ['dist']

  # The gate a release has to clear. `test` runs against an editable install of
  # the source tree, which is the one arrangement where every path resolves --
  # it cannot see a module the wheel failed to package.
  verify:
    command: 'bash tools/verify-wheel.sh'
    toolchains: ['system']
    deps: ['~:build']
    inputs: ['@group(sources)', '@group(manifests)', 'tools/verify-wheel.sh']
