# The `kbve` PyPI package, ported from the legacy Nx workspace at
# KBVE/kbve packages/python/kbve.
#
# The project id is `kbve-py`, not the directory name, and it is set by the
# `sources` entry in .moon/workspace.yml -- which explains why. It is not
# repeated here: moon.yml's own `id:` field wins over that entry, so setting
# both means one of them can quietly stop being true.
layer: 'library'
language: 'python'
# Not 'backend', which is what this was and what the server stack still is.
# That stack is an optional extra now: what `pip install kbve` gives you is the
# SEO auditor, the ArgoCD annotation passes and the Unreal compile-database
# tooling. The base install is infrastructure tooling, so the stack says so.
stack: 'infrastructure'

# 'uv' brings install, test, lint and build -- see .moon/tasks/uv.yml, which
# stands in for the python toolchain file moon 2.5 cannot provide.
#
# 'pypi' is descriptive for now, the way 'proto' is on packages/protobuf: no
# .moon/tasks/pypi.yml exists yet, so nothing is inherited from it. It is here
# so the project is discoverable by `moon query projects --tag pypi` alongside
# the npm and itch publishers, and so the publish task set has something to
# attach to when release plumbing lands.
tags: ['uv', 'pypi']

owners:
  defaultOwner: '@h0lybyte'

fileGroups:
  # The package directory. uv.yml cannot know this -- it is named after the
  # distribution -- so it is the one file group a tagged project has to supply.
  sources:
    - 'kbve/**/*'
  tests:
    - 'tests/**/*'

tasks:
  # The gate a release has to clear, and the only task here that is not
  # inherited. `test` runs against an editable install of the source tree,
  # which is the one arrangement where every path resolves -- it cannot see a
  # module the wheel failed to package, or a dependency that quietly became
  # mandatory.
  verify:
    command: 'bash tools/verify-wheel.sh'
    toolchains: ['system']
    deps: ['~:build']
    inputs: ['@group(sources)', '@group(manifests)', 'tools/verify-wheel.sh']
