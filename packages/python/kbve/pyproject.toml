[project]
name = "kbve"
version = "2.0.0"
description = "KBVE - API layer and complexity handler for async HTTP, WebSocket, gRPC, and broadcasting"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=1.10,<3.0",
    "aiohttp>=3.9,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "grpcio>=1.62,<2.0",
    "protobuf>=4.25,<6.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# kbve.blender. Three of its five modules import bpy and only ever run inside
# Blender, which brings its own interpreter -- nothing to install for those.
# pack_orm is the exception: it stays out of Blender on purpose (see its
# docstring) and needs Pillow. Upstream declared no blender extra at all and
# left Pillow in `sprite`, so `pip install kbve` gave you a kbve-blender-turf
# that worked and a pack_orm that raised ImportError.
blender = [
    "pillow>=10.0,<12.0",
]

[project.scripts]
kbve-blender-retarget = "kbve.blender.cli:retarget_main"
kbve-blender-vat = "kbve.blender.cli:vat_main"
kbve-blender-turf = "kbve.blender.cli:turf_main"

# Everything else the Nx workspace hung off this distribution stayed there:
# kbve.nx, kbve.sprite, kbve.osrs, kbve.seo, kbve.mdx, kbve.svg, kbve.ai,
# kbve.unreal and kbve.argocd, and 15 of the original 18 console scripts. Half
# of them read paths that exist only in that repository.

[dependency-groups]
dev = [
    "autopep8==2.0.2",
    "flake8==6.0.0",
    "pytest==8.3.3",
    "pytest-sugar==0.9.7",
    "pytest-cov==4.1.0",
    "pytest-asyncio>=0.23,<1.0",
    "grpcio-tools>=1.62,<2.0",
    "httpx>=0.27,<1.0",
    # kbve.blender.pack_orm, so its tests are not silently skipped.
    "pillow>=10.0,<12.0",
]

# The package is fully annotated and ships .pyi stubs for the generated proto
# modules. Without py.typed beside them PEP 561 says a type checker must ignore
# the lot, so the stubs would be dead weight in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["kbve"]

[tool.coverage.run]
branch = true
source = [ "kbve" ]
# These import bpy at module scope, so they cannot be imported by the test
# venv at all -- coverage would report each as 0% and drag the total down to
# describe code no test could ever reach. Their wrapper in kbve.blender.cli is
# covered, and what happens inside Blender needs Blender to check.
omit = [
    "kbve/blender/retarget.py",
    "kbve/blender/turf_bake.py",
    "kbve/blender/vat_bake.py",
]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
# Project-relative on purpose. Upstream wrote these to '../../../coverage/...',
# which only resolves at one nesting depth and put the artifacts outside the
# project moon would have to declare them as outputs of.
addopts = "--cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml"
asyncio_mode = "auto"
# Unset, pytest-asyncio warns on every run that the default will change in a
# future release. "function" is the current default, so this pins today's
# behaviour rather than adopting an unreviewed one later.
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
