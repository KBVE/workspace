[package]
name = "rentearth-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The API behind api.rentearth.com."

[dependencies]
axum.workspace = true
kbve-proto = { path = "../../../crates/kbve-proto" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# oneshot() drives the router without binding a port, so the routing and the
# serialisation are covered by `cargo test` rather than by a running server.
tower = { version = "0.5.2", features = ["util"] }
