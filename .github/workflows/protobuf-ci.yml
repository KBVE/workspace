name: protobuf-ci

# What `moon ci` cannot do.
#
# buf lint, buf format, generation and the "every language produced output"
# check are all moon tasks now, so they run in the main ci workflow off the
# project graph. What is left here needs toolchains moon does not manage --
# dotnet, python, a bare node -- and an artifact upload, which is a workflow
# concern by definition.
#
# A new language to verify is a row in the compile matrix, not another
# workflow. The path filter below is the one piece of duplication left: moon
# derives the same thing from task inputs, but a workflow cannot ask it.
on:
  push:
    branches: [main]
    paths: ['packages/protobuf/**', '.github/workflows/protobuf-ci.yml']
  pull_request:
    paths: ['packages/protobuf/**', '.github/workflows/protobuf-ci.yml']
  merge_group:

# Least privilege. Nothing in this workflow writes to the repository, and on a
# public repo the default token grant would otherwise be handed to every fork
# pull request that runs here.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: protobuf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The descriptor set is what non-buf tooling consumes: the zod emitters in
  # KBVE/kbve read a FileDescriptorSet, not .proto text. Publishing it as an
  # artifact means that tooling has something to fetch that is built from a
  # reviewed commit.
  descriptor:
    name: descriptor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/protobuf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: Build descriptor set
        run: buf build --output descriptor.binpb --as-file-descriptor-set

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: descriptor-set
          # upload-artifact resolves paths from the workspace, not the job's
          # working directory, and only warns when it finds nothing.
          path: packages/protobuf/descriptor.binpb
          if-no-files-found: error
          retention-days: 30

  # Generating is not compiling. buf reports success as long as a plugin runs,
  # so output that no toolchain will accept still passes generation: a field
  # name that is a C# keyword, a package layout that collides in Python, a
  # prost module tree that does not resolve. Each language is compiled here
  # with the same toolchain its consumers use.
  compile:
    name: compile (${{ matrix.lang }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/protobuf
    strategy:
      # One language failing should not hide the state of the other three.
      fail-fast: false
      matrix:
        lang: [rust, ts, csharp, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: Generate
        run: buf generate

      - name: Rust
        if: matrix.lang == 'rust'
        working-directory: packages/protobuf/verify/rust
        run: |
          mkdir -p src
          cp -r "$GITHUB_WORKSPACE/packages/protobuf/gen/rust/." src/
          # prost-crate names the module tree mod.rs; cargo wants lib.rs.
          mv src/mod.rs src/lib.rs
          cargo check --locked || cargo check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.lang == 'ts'
        with:
          node-version: '22'

      - name: TypeScript
        if: matrix.lang == 'ts'
        working-directory: packages/protobuf/verify/ts
        run: |
          cp -r "$GITHUB_WORKSPACE/packages/protobuf/gen/ts" src
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: '8.0.x'

      - name: C#
        if: matrix.lang == 'csharp'
        working-directory: packages/protobuf/verify/csharp
        run: |
          find "$GITHUB_WORKSPACE/packages/protobuf/gen/csharp" -name '*.cs' -exec cp {} . \;
          dotnet build --nologo -v quiet

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.lang == 'python'
        with:
          python-version: '3.12'

      - name: Python
        if: matrix.lang == 'python'
        run: |
          pip install --quiet protobuf
          python verify/python/verify.py gen/python
