name: itch

# Publishes a game's web build to its itch.io page.
#
# This is a workflow rather than a moon task because the execution context
# differs from ci.yml in both ways that justify one: it needs BUTLER_API_KEY,
# and it runs on a release tag rather than on every push. The build itself is
# still a moon task, so what CI checks and what ships are the same artifact
# produced the same way.
#
# Adding a game is one entry in the matrix below. Everything that differs
# between games lives there -- the moon build task, where that task leaves its
# output, and the itch page and channel it belongs on. Nothing else in this
# file names a project.
#
# The itch page slug is the one thing the project graph cannot answer: it lives
# on itch, not in this repository, and `fish-and-chip` ships to a page called
# `fishchip`. That is what the matrix is for. The version is not in it -- the
# tag carries that, and it is verified against the project's own manifest
# before anything is uploaded, so a channel can never be labelled with a
# version the manifest never claimed.
on:
  push:
    tags: ['*@*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. fish-and-chip@0.1.0'
        required: true

permissions:
  contents: read

# Keyed by tag rather than by game: two pushes to the same channel would race
# inside butler's diffing, and a half-uploaded build is worse than a slow one.
concurrency:
  group: itch-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.project }} to itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fish-and-chip
            build: fish-and-chip:build
            dist: apps/arcade/fish-and-chip/dist
            itch: kbve/fishchip
            channel: html
            # Optional. When set, the task boots the built game in a browser
            # before anything is uploaded. Leave it off a game that has no such
            # task and the gate simply skips.
            e2e: fish-and-chip:e2e
          # A wasm-bindgen bundle rather than a Vite one, but the channel is
          # still `html`: itch treats any browser build the same way.
          - project: rentearth-bevy
            build: rentearth-bevy:build-web
            dist: apps/arcade/rentearth-bevy/dist
            itch: kbve/rentearth
            channel: html
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    # A tag names exactly one project, so every other matrix entry no-ops. The
    # guard has to be repeated per step rather than set once on the job: the
    # matrix context is not available in a job-level `if`.
    steps:
      - name: Does this tag belong to ${{ matrix.project }}?
        id: mine
        run: |
          if [ "${TAG%@*}" = "${{ matrix.project }}" ]; then
            echo "mine=true" >> "$GITHUB_OUTPUT"
          else
            echo "mine=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not a ${{ matrix.project }} release; nothing to do."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.mine.outputs.mine == 'true'
        with:
          # The water textures are LFS objects. Without this they check out as
          # pointer files and the game ships with placeholder water.
          lfs: true

      # rentearth-bevy's water shader lives in git-crypt encrypted source. A
      # release has the key, so it ships the real shader rather than the
      # keyless fallback the build would otherwise select.
      - uses: ./.github/actions/git-crypt-unlock
        if: steps.mine.outputs.mine == 'true'
        with:
          key: ${{ secrets.GIT_CRYPT_KEY }}

      # Same workaround as ci.yml: proto's rust plugin can leave an empty
      # toolchain directory and still report success, so the toolchain is
      # installed for real before proto looks for it. See the comment there.
      - name: Install the pinned Rust toolchain
        if: steps.mine.outputs.mine == 'true' && matrix.project == 'rentearth-bevy'
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$version" \
            --profile minimal --component clippy --component rustfmt --force
          rustup target add wasm32-unknown-unknown --toolchain "$version"

      # Pinned to the wasm-bindgen crate in Cargo.lock. A CLI newer or older
      # than the crate emits a bundle that fails at import with no useful
      # message; build-web.sh checks the pair and refuses to run on a mismatch.
      - name: Install wasm-bindgen
        if: steps.mine.outputs.mine == 'true' && matrix.project == 'rentearth-bevy'
        run: |
          version="$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;q;}' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          curl -fsSL -o wasm-bindgen.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/${name}.tar.gz"
          tar xzf wasm-bindgen.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        if: steps.mine.outputs.mine == 'true'
        with:
          auto-install: true

      - name: Tag matches the manifest
        if: steps.mine.outputs.mine == 'true'
        run: node tools/release/verify-tag.mjs "$TAG"

      - name: Build
        if: steps.mine.outputs.mine == 'true'
        run: moon run ${{ matrix.build }}

      # itch serves an HTML build from an index.html at the root of the upload.
      # Without this the push succeeds and the page shows itch's own "no index"
      # error, which reads as a broken game rather than a broken upload.
      - name: Build has an entry point
        if: steps.mine.outputs.mine == 'true'
        run: test -f "${{ matrix.dist }}/index.html"

      # The last gate before a build reaches the public. Unit tests mock the
      # engine away, so this is the only thing that proves the game starts,
      # loads its assets, and reaches a playable scene -- served from a path
      # prefix, the way itch serves it. Games without an `e2e` task skip it.
      - name: Boot the built game
        if: steps.mine.outputs.mine == 'true' && matrix.e2e != ''
        run: moon run ${{ matrix.e2e }}

      # butler is fetched from itch's own broth channel rather than a
      # third-party action, so nothing outside itch and GitHub is trusted with
      # the API key.
      - name: Install butler
        if: steps.mine.outputs.mine == 'true'
        run: |
          curl -fsSL -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Push build
        if: steps.mine.outputs.mine == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ matrix.itch }}:${{ matrix.channel }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY is not set. Add it from https://itch.io/user/settings/api-keys."
            exit 1
          fi
          # Split on the LAST @, the way verify-tag.mjs does, so a scoped
          # project id keeps parsing.
          butler push "${{ matrix.dist }}" "$ITCH_TARGET" \
            --userversion "${TAG##*@}"
          butler status "$ITCH_TARGET"
