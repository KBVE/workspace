name: itch

# Publishes a game's web build to its itch.io page.
#
# Nothing here names a game. A `<project>@<version>` tag resolves to a node in
# the project graph, and that node says everything this workflow needs to know:
# whether the project ships to itch at all (the 'itch' tag), whether its assets
# have to be fetched from the LFS store first (the 'lfs' tag), and -- through
# the publish task inherited from the 'itch' tag -- which page it belongs on
# and which task builds what ships.
#
# So adding a game is an edit to that game's own moon.yml and nothing else.
# That is the property that has to hold at a hundred apps; the per-game matrix
# this replaces was the same enumeration-outside-the-graph that the legacy
# dispatch manifest was.
#
# Anything a single project needs installed belongs in that project's graph
# too, as a task its build depends on -- see rentearth-bevy's `wasm-bindgen`.
# A step here would put a game's name back in a shared file.
on:
  push:
    tags: ['*@*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. fish-and-chip@0.2.0'
        required: true

permissions:
  contents: read

# Keyed by tag rather than by game: two pushes to the same channel would race
# inside butler's diffing, and a half-uploaded build is worse than a slow one.
concurrency:
  group: itch-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Split from the publish job so that the gate is a job-level `if` and every
  # step below it is unconditional. The alternative -- one job -- means
  # repeating the same condition on each step, which is what the matrix version
  # of this file did and what made it hard to read.
  resolve:
    name: resolve ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      project: ${{ steps.tag.outputs.project }}
      version: ${{ steps.tag.outputs.version }}
      tags: ${{ steps.tag.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Resolves the tag against the project graph and against the project's
      # own manifest, and reports what it found. A mismatch means the version
      # bump was never committed, and publishing it would label a channel with
      # a version the manifest never claimed.
      - name: Tag matches the manifest
        id: tag
        run: node tools/release/verify-tag.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Not an itch release
        if: ${{ !contains(fromJSON(steps.tag.outputs.tags), 'itch') }}
        run: |
          echo "::notice::${{ steps.tag.outputs.project }} is not tagged 'itch'; nothing to publish."

  publish:
    name: publish ${{ needs.resolve.outputs.project }} to itch.io
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.tags), 'itch')
    runs-on: ubuntu-latest
    # Sixty rather than thirty because a threaded wasm build rebuilds the
    # standard library from source and rentearth ships two of them, which is
    # around half an hour on a runner by itself. The ceiling is shared by every
    # game here; it bounds a hung build rather than budgeting a healthy one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always off. .lfsconfig points LFS at a self-hosted Forgejo, and
          # actions/checkout only knows how to authenticate against GitHub, so
          # `lfs: true` cannot fetch these blobs whatever the project. The
          # credential comes from the step below, and the fetch from the
          # project's own `assets` task.
          lfs: false

      # Some source in this repository is git-crypt encrypted and is compiled
      # rather than merely read, so a release has to decrypt it to ship the
      # real thing. Reports and continues without the key, which is what makes
      # a fork's build fail on the missing source rather than on an auth error.
      - uses: ./.github/actions/git-crypt-unlock
        with:
          key: ${{ secrets.GIT_CRYPT_KEY }}

      # A credential, not a fetch. Which blobs to pull is decided by the
      # project's own `assets` task, scoped to its source directory -- the blob
      # store is shared across games and a release has no reason to download
      # another game's character models. Unconditional because it costs
      # nothing: a project with no LFS assets simply never asks.
      - uses: ./.github/actions/lfs-auth
        with:
          user: ${{ secrets.FORGEJO_USER }}
          token: ${{ secrets.FORGEJO_TOKEN }}

      # The web export templates, which proto's Godot pin cannot install (see
      # .proto/plugins/godot.toml). Only the web set is kept -- 85MB rather
      # than the several gigabytes the full archive unpacks to -- so restoring
      # it unconditionally is cheap, and it saves a 1.2GB download every time a
      # Godot game is affected. Keyed on .prototools, which is where the engine
      # version that decides the directory name lives.
      #
      # Deliberately not caching LFS blobs alongside it: the store is nearly
      # half a gigabyte, the `assets` task fetches only the affected project's
      # share, and restoring all of it on every job would cost more than it
      # saves.
      - name: Restore the Godot export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.prototools') }}

      # The next two are restores with no matching save, which looks like an
      # oversight and is not. Actions scopes a cache to the ref that wrote it.
      # This workflow runs on tag pushes, and every release is a different tag,
      # so anything written here would be readable only by a re-run of the same
      # tag -- never by the next release. What a tag ref can read is what the
      # default branch wrote. So ci.yml on main is the writer for both of these
      # and this workflow is a pure reader, and the two files have to agree on
      # the key character for character or the hit never happens. Adding a save
      # here would not fix anything; it would spend the repository's ten
      # gigabytes of cache on per-tag copies nothing reads.
      #
      # Neither entry names a game, for the same reason nothing else in this
      # file does. A project with no browser build has no target directory to
      # restore, the restore misses, and the job carries on exactly as before.
      - name: Restore the cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The expensive one. A threaded wasm bundle rebuilds the standard library
      # from source and rentearth ships two of them, which is the sixteen of
      # this job's seventeen minutes; with the target directory already on disk
      # only the game crate recompiles and it is about a minute. The pinned
      # nightly rides along in the same entry because it is what build-std's
      # output is valid for -- caching one without the other would let a
      # toolchain bump restore artifacts no compiler here can use.
      #
      # The key is explained in ci.yml, which writes it. In short: the first
      # hash covers the RUSTFLAGS and the nightly pin, either of which
      # invalidates every artifact including std's, and the lockfile is a
      # separate segment so a dependency bump can still fall back on the
      # previous build.
      - name: Restore the browser build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/wasm32-unknown-unknown/release
            ~/.rustup/toolchains/nightly-*
          key: wasm-${{ runner.os }}-${{ hashFiles('apps/**/tools/build-web.sh', 'apps/**/tools/wasm-toolchain.txt') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-${{ hashFiles('apps/**/tools/build-web.sh', 'apps/**/tools/wasm-toolchain.txt') }}-

      # Same workaround as ci.yml: proto's rust plugin can leave an empty
      # toolchain directory and still report success, so the toolchain is
      # installed for real before proto looks for it. See the comment there.
      #
      # Not gated on the project. moon sets up every toolchain the workspace
      # declares before it runs anything, so a TypeScript game's build asks for
      # cargo too and dies on `missing_executable` without this.
      - name: Install the pinned Rust toolchain
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$version" \
            --profile minimal --component clippy --component rustfmt --force
          rustup target add wasm32-unknown-unknown --toolchain "$version"

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Builds and uploads. The task depends on whichever task produces the
      # shipping artifact and on whatever gate the project put in front of a
      # release, so what reaches the public is the artifact CI checked, built
      # the same way. ITCH_DRY_RUN=0 is the opt-out: the task's default is a
      # dry run so that `moon check` can never publish.
      #
      # The version comes from the tag, which the resolve job already checked
      # against the manifest -- so a channel cannot be labelled with a version
      # the project never claimed.
      - name: Publish
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_DRY_RUN: '0'
          ITCH_USERVERSION: ${{ needs.resolve.outputs.version }}
        run: moon run ${{ needs.resolve.outputs.project }}:publish
