name: ci

# Every project in the workspace, off the moon graph, so a project added later
# is covered without editing this file. That includes the schema checks -- buf
# lint, buf format, generation, and the assertion that every language produced
# output are all moon tasks.
#
# A workflow is only worth adding when the execution context differs: a runner
# moon cannot reach, a secret, or a cadence. protobuf-ci.yml earns one because
# it needs dotnet and python toolchains and uploads an artifact. Everything
# else belongs in a task here, where the project graph already knows what a
# change affects.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The generated CODEOWNERS is an artifact of each project's owners block, so
  # it can fall behind when someone edits moon.yml without running a task.
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: CODEOWNERS is up to date
        run: |
          moon sync codeowners
          git diff --exit-code -- .github/CODEOWNERS \
            || { echo "::error::CODEOWNERS is stale. Run 'moon sync codeowners' and commit."; exit 1; }

  ci:
    name: ci (${{ matrix.index }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1]
        total: [2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # moon compares against the base to decide what is affected.
          fetch-depth: 0

      # rentearth-bevy compiles src/private, which is git-crypt encrypted in the
      # repository. Without the key that crate cannot build. Fork pull requests
      # get no secrets, so this reports and continues rather than failing here.
      - uses: ./.github/actions/git-crypt-unlock
        with:
          key: ${{ secrets.GIT_CRYPT_KEY }}

      # Both of the next two steps exist to work around proto's rust plugin.
      # It shells out to rustup, then returns `installed: true` whatever the
      # result -- its own source says "Always mark as installed so that
      # binaries can be located!". When that rustup call does nothing (it
      # returns in about a second, far too fast to have downloaded anything)
      # the plugin leaves an empty toolchain directory behind, and moon then
      # fails with:
      #
      #   Unable to find an executable for Rust, expected file
      #   ~/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo
      #
      # An empty directory is also enough for rustup to answer "using existing
      # install", so a plain `rustup toolchain install` will not repair it.
      # Installing with --force before proto runs means the plugin finds a
      # populated bin/ and skips its own install entirely.
      #
      # The runner image ships only the stable toolchain, from
      # /etc/skel/.rustup, so the pinned version is always a fresh download.
      # Caching it keeps that to once per toolchain change rather than once
      # per job.
      - name: Restore the Rust toolchain
        id: rustup-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the pinned Rust toolchain
        if: steps.rustup-cache.outputs.cache-hit != 'true'
        # The version is read from rust-toolchain.toml rather than written out
        # again here, so the pin still lives in one place. --profile and the
        # components have to be passed explicitly: --force bypasses the file.
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$version" \
            --profile minimal --component clippy --component rustfmt --force
          test -x "$HOME/.rustup/toolchains/$version-$(uname -m)-unknown-linux-gnu/bin/cargo" \
            || { echo "::error::rustup did not produce a cargo binary for $version"; exit 1; }

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # buf resolves remote plugins from the BSR, which rate-limits anonymous
      # requests. The token is absent on fork pull requests, where the
      # anonymous limit has to do.
      - name: Run affected tasks
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: moon ci --job ${{ matrix.index }} --job-total ${{ matrix.total }}
