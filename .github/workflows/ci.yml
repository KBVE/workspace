name: ci

# Every project in the workspace, off the moon graph, so a project added later
# is covered without editing this file. That includes the schema checks -- buf
# lint, buf format, generation, and the assertion that every language produced
# output are all moon tasks.
#
# A workflow is only worth adding when the execution context differs: a runner
# moon cannot reach, a secret, or a cadence. protobuf-ci.yml earns one because
# it needs dotnet and python toolchains and uploads an artifact. Everything
# else belongs in a task here, where the project graph already knows what a
# change affects.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The commit-msg hook covers commits, but a pull request title is composed in
  # the browser where no hook runs -- and label-pr.mjs reads the type out of it.
  # An unconventional title silently gets no kind/* label rather than a wrong
  # one, which is the kind of failure nobody notices.
  title:
    name: title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Reads labels.lock.json, so it needs no toolchain and no project graph.
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node tools/commit/validate.mjs --title "$TITLE"

  # The hook is the real enforcement, but it is local: `--no-verify` skips it,
  # and a clone whose hooks were never synced has none at all. Nothing else
  # looked at a commit message -- the job above reads a pull request title, and
  # work lands on main directly here -- so a bad message was only ever found by
  # reading the log. This finds it on the push that introduced it.
  #
  # It reports rather than prevents: the commits are already on main by the
  # time it runs. Rewriting them is the fix, and it has to be a decision rather
  # than something CI does.
  commits:
    name: commits
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history: the range starts at the commit main was on before this
      # push, which the default single-commit checkout does not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit messages
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # `before` is all zeroes when the branch is created, and names a
          # commit that no longer exists after a force push. Falling back to
          # the head commit alone checks something rather than erroring on a
          # range git cannot resolve.
          range="$SHA~1..$SHA"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          fi
          echo "Checking $range"
          failed=0
          while IFS= read -r subject; do
            node tools/commit/validate.mjs --title "$subject" || failed=1
          done < <(git log --no-merges --format=%s "$range")
          exit $failed

  # The generated CODEOWNERS is an artifact of each project's owners block, so
  # it can fall behind when someone edits moon.yml without running a task.
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: CODEOWNERS is up to date
        run: |
          moon sync codeowners
          git diff --exit-code -- .github/CODEOWNERS \
            || { echo "::error::CODEOWNERS is stale. Run 'moon sync codeowners' and commit."; exit 1; }

  ci:
    name: ci (${{ matrix.index }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1]
        total: [2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # moon compares against the base to decide what is affected.
          fetch-depth: 0

      # rentearth-bevy compiles src/private, which is git-crypt encrypted in the
      # repository. Without the key that crate cannot build. Fork pull requests
      # get no secrets, so this reports and continues rather than failing here.
      - uses: ./.github/actions/git-crypt-unlock
        with:
          key: ${{ secrets.GIT_CRYPT_KEY }}

      # Two games keep their art in the LFS store named in .lfsconfig, which is
      # self-hosted and needs a credential. Their `assets` task does the
      # fetching, scoped to the project moon says is affected; without this it
      # cannot authenticate and the build fails on a pointer file where a model
      # should be.
      - uses: ./.github/actions/lfs-auth
        with:
          user: ${{ secrets.FORGEJO_USER }}
          token: ${{ secrets.FORGEJO_TOKEN }}

      # Both of the next two steps exist to work around proto's rust plugin.
      # It shells out to rustup, then returns `installed: true` whatever the
      # result -- its own source says "Always mark as installed so that
      # binaries can be located!". When that rustup call does nothing (it
      # returns in about a second, far too fast to have downloaded anything)
      # the plugin leaves an empty toolchain directory behind, and moon then
      # fails with:
      #
      #   Unable to find an executable for Rust, expected file
      #   ~/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/bin/cargo
      #
      # An empty directory is also enough for rustup to answer "using existing
      # install", so a plain `rustup toolchain install` will not repair it.
      # Installing with --force before proto runs means the plugin finds a
      # populated bin/ and skips its own install entirely.
      #
      # The runner image ships only the stable toolchain, from
      # /etc/skel/.rustup, so the pinned version is always a fresh download.
      # Caching it keeps that to once per toolchain change rather than once
      # per job.
      # The web export templates, which proto's Godot pin cannot install (see
      # .proto/plugins/godot.toml). Only the web set is kept -- 85MB rather
      # than the several gigabytes the full archive unpacks to -- so restoring
      # it unconditionally is cheap, and it saves a 1.2GB download every time a
      # Godot game is affected. Keyed on .prototools, which is where the engine
      # version that decides the directory name lives.
      #
      # Deliberately not caching LFS blobs alongside it: the store is nearly
      # half a gigabyte, the `assets` task fetches only the affected project's
      # share, and restoring all of it on every job would cost more than it
      # saves.
      - name: Restore the Godot export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Restore the Rust toolchain
        id: rustup-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the pinned Rust toolchain
        if: steps.rustup-cache.outputs.cache-hit != 'true'
        # The version is read from rust-toolchain.toml rather than written out
        # again here, so the pin still lives in one place. --profile and the
        # components have to be passed explicitly: --force bypasses the file.
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$version" \
            --profile minimal --component clippy --component rustfmt --force
          test -x "$HOME/.rustup/toolchains/$version-$(uname -m)-unknown-linux-gnu/bin/cargo" \
            || { echo "::error::rustup did not produce a cargo binary for $version"; exit 1; }

      # What cargo downloads, not what it produces. The registry index and the
      # .crate tarballs are what a cold runner spends its first minutes on
      # before it compiles a line, and they are the same for every job here, so
      # one entry keyed on the lockfile serves the whole workspace. registry/src
      # is deliberately not in the list: cargo re-extracts it from the tarballs
      # beside it in seconds, and keeping the extracted copy as well would
      # roughly treble what this uploads for nothing. The fallback key matters
      # more than the exact one -- a lockfile bump changes a handful of crates
      # and leaves the rest of the download worth keeping.
      - name: Restore the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Compiled dependency artifacts for the native targets.
      #
      # The registry cache above holds downloads; nothing held the results of
      # compiling them, so every run rebuilt the whole dependency graph --
      # Bevy, avian, duckdb -- before it could touch a line of this repository.
      # `moon ci` only runs affected projects, but "affected" is about our
      # crates; their dependencies are cold either way on a fresh runner.
      #
      # Swatinem/rust-cache rather than another actions/cache block, because
      # the hard part is what NOT to keep: it prunes the workspace crates' own
      # artifacts and keeps dependencies and their fingerprints, which is what
      # makes this fit in a cache budget that already holds a wasm target
      # directory. Caching target/ wholesale would evict that.
      #
      # save-if limits writes to main. Pull requests restore and never save, so
      # a branch cannot fill the budget with a cache only it will ever use.
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The wasm cache below owns target/wasm32-unknown-unknown; this is
          # the shard key so two matrix jobs do not overwrite each other.
          key: job-${{ matrix.index }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The browser build's compiled output, and the nightly that produces it.
      #
      # A threaded wasm bundle rebuilds the standard library from source --
      # `-Z build-std`, because the wasm32 std rustup ships has no atomics --
      # and rentearth ships two of them, one per wgpu backend. That is about a
      # quarter of an hour, of which all but the last minute is dependencies
      # and std that no change in this repository touches. With the target
      # directory already on disk only the game crate recompiles and the task
      # finishes in around a minute.
      #
      # This step is also the only way the release workflow can ever have a
      # warm target directory, and that is not obvious enough to survive a
      # tidy-up. Actions scopes a cache to the ref that wrote it. itch.yml runs
      # on tag pushes, so a cache written while publishing one tag cannot be
      # read while publishing the next, and caching there would only ever help
      # a re-run of the same tag. A tag ref can read what the default branch
      # wrote, though -- so the writer has to live here, on main, and itch.yml
      # only restores. Deleting this step puts a quarter of an hour back on
      # every release, silently, with nothing failing to say so.
      #
      # Note that this costs main nothing it was not already paying: build-web
      # is a normal task in the graph, so `moon ci` compiles those bundles
      # whenever rentearth-bevy is affected whether or not anything caches the
      # result.
      #
      # Nothing here names a game, which is the property itch.yml depends on.
      # The key hashes whatever browser build scripts the workspace happens to
      # have, and that is where both of the things that invalidate every
      # artifact live: the RUSTFLAGS are written inside build-web.sh, and the
      # nightly pin -- which decides what build-std's output is even valid for
      # -- inside wasm-toolchain.txt. The lockfile is a second segment rather
      # than part of the same hash so that a dependency bump falls back through
      # restore-keys onto the previous build instead of onto nothing.
      - name: Restore the browser build
        id: wasm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/wasm32-unknown-unknown/release
            ~/.rustup/toolchains/nightly-*
          key: wasm-${{ runner.os }}-${{ hashFiles('apps/**/tools/build-web.sh', 'apps/**/tools/wasm-toolchain.txt') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-${{ hashFiles('apps/**/tools/build-web.sh', 'apps/**/tools/wasm-toolchain.txt') }}-

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # buf resolves remote plugins from the BSR, which rate-limits anonymous
      # requests. The token is absent on fork pull requests, where the
      # anonymous limit has to do.
      - name: Run affected tasks
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: moon ci --job ${{ matrix.index }} --job-total ${{ matrix.total }}

      # Restore and save are split for the two steps below, rather than left to
      # one actions/cache, because this job is a matrix and only one half of it
      # ever runs a browser build. The combined action saves whatever is on
      # disk when any job ends, so the half that compiled no wasm would write
      # its empty -- or merely restored, and therefore stale -- target
      # directory under the key first, and the half that did the work would
      # then find the key already taken. So the save asks what this job
      # actually produced. A wasm-bindgen bundle in a dist is the answer:
      # build-web clears that directory and rewrites it, and nothing restores
      # it, so its presence means the compile happened here and now.
      - name: Did a browser build run
        id: wasm-built
        if: always()
        run: |
          shopt -s nullglob
          bundles=(apps/*/*/dist/*_bg.wasm)
          if [ "${#bundles[@]}" -gt 0 ]; then
            echo 'built=true' >> "$GITHUB_OUTPUT"
          fi

      # Saved even when the run failed: a lint that came back red leaves the
      # compiled dependencies just as valid as a green one, and throwing them
      # away would mean the next push pays the full quarter of an hour again.
      # Skipped on an exact restore hit, where there is by definition nothing
      # new to write.
      - name: Save the browser build
        if: ${{ always() && steps.wasm-built.outputs.built == 'true' && steps.wasm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/wasm32-unknown-unknown/release
            ~/.rustup/toolchains/nightly-*
          key: wasm-${{ runner.os }}-${{ hashFiles('apps/**/tools/build-web.sh', 'apps/**/tools/wasm-toolchain.txt') }}-${{ hashFiles('Cargo.lock') }}
