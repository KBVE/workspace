name: 'lfs auth'
description: 'Gives the job a credential for the self-hosted Git LFS endpoint.'

# Authenticates, and does not fetch. .lfsconfig points every LFS object in this
# monorepo at Forgejo (git.kbve.com/KBVE/friendslop), which requires a
# credential -- an anonymous batch request returns 401 -- and actions/checkout
# only knows how to authenticate against GitHub, so `lfs: true` there cannot
# fetch these blobs.
#
# Which blobs a job needs is a question the project graph already answers: a
# project tagged 'lfs' has an `assets` task its build depends on, scoped to its
# own source directory. So this action's whole job is to make that task able to
# reach the store. Fetching here as well would mean two things deciding what to
# download, and the one without the graph would always be the wrong one.
#
# Without a credential it reports and continues. Fork pull requests get no
# secrets, and failing here would report a confusing auth error rather than
# letting the build fail on the asset it actually needed.

inputs:
  user:
    description: 'Forgejo username. Pass secrets.FORGEJO_USER.'
    required: false
    default: ''
  token:
    description: 'Forgejo token. Pass secrets.FORGEJO_TOKEN.'
    required: false
    default: ''

outputs:
  authenticated:
    description: 'true when a credential was configured.'
    value: ${{ steps.auth.outputs.authenticated }}

runs:
  using: composite
  steps:
    - id: auth
      shell: bash
      env:
        FORGEJO_USER: ${{ inputs.user }}
        FORGEJO_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        if [ -z "${FORGEJO_TOKEN}" ] || [ -z "${FORGEJO_USER}" ]; then
          echo "authenticated=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No Forgejo credential; LFS blobs stay as pointers."
          exit 0
        fi

        # The endpoint is declared once, at the repository root: git-lfs reads
        # .lfsconfig from there only. Reading it back rather than hard-coding
        # the host means moving the blob store is a one-line change.
        url=$(git config -f .lfsconfig lfs.url)
        rest="${url#*//}"
        host="${rest%%/*}"

        # A credential helper, NOT http.<host>.extraheader.
        #
        # extraheader forces an Authorization header onto every request to the
        # host. That is right for a plain git remote and wrong for LFS: the
        # batch endpoint answers with a per-object download href carrying an
        # Authorization header Forgejo minted itself, and git-lfs sends that
        # one too. Forgejo gets two Authorization headers and answers 400,
        # which git-lfs reports only as "Client error: <url>" -- once per
        # object, with no status code, for every object in the fetch.
        #
        # Either header alone is a 200. It is the pair that fails, which is why
        # this passes locally, where a developer's credential helper answers
        # the batch call and forces nothing onto the download.
        git config --local credential.helper store

        # `git credential approve` writes through the helper and does its own
        # escaping, so a token containing URL metacharacters cannot corrupt the
        # store file the way a hand-built https://user:pass@host line can.
        printf 'protocol=https\nhost=%s\nusername=%s\npassword=%s\n\n' \
          "${host}" "${FORGEJO_USER}" "${FORGEJO_TOKEN}" | git credential approve

        echo "authenticated=true" >> "$GITHUB_OUTPUT"
        echo "Configured a Git LFS credential for https://${host}."
