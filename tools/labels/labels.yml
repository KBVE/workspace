# The labels this repository uses. Source of truth.
#
# Two halves. The ones below are written by hand, because "is this a bug" is a
# judgement no graph can make. The scope labels -- area/* and tag/* -- are not
# here at all: sync.mjs derives them from the moon project graph, the same way
# .github/CODEOWNERS is generated, so they cannot drift from the projects they
# describe. Adding a tag to a moon.yml adds the label.
#
# sync.mjs never deletes. Labels already on GitHub that are not described here
# are reported and left alone.
#
# Prefixes are load-bearing: GitHub's label picker is a substring match, so
# typing "kind/" narrows to one family.
#
# `supersedes` names an older label that means the same thing. sync.mjs renames
# it rather than creating a second one, so the label and anything filed under it
# survive and the duplicate spelling stops existing. Renaming is why this can be
# non-destructive: nothing is deleted, and no issue loses a label.

# What the work is. Roughly the conventional-commit types this repository
# actually uses.
#
# `commit` lists the conventional-commit types that imply the label, space
# separated. It is what label-pr.mjs reads to turn a pull request title into a
# kind, so the mapping lives beside the label rather than in the workflow that
# applies it. A type named twice would make the mapping ambiguous, and a test
# rejects that.
#
# Originally -- feat, fix, refactor, chore, test, docs account for 91 of the
# last 94 commits -- plus the two that describe an issue rather than a change.
kind:
  - name: 'kind/bug'
    color: 'd73a4a'
    description: "Something is broken"
    supersedes: 'bug'
    commit: 'fix'
  - name: 'kind/feature'
    color: '0e8a16'
    description: 'New capability. Lands as feat()'
    supersedes: 'enhancement'
    # `content` sits with feat rather than docs on purpose: game text and data
    # are not prose about the software, they are the thing that ships. The
    # pipeline takes MDX to SQL, or straight into the game, so authoring a
    # telegram line adds capability the same way code does.
    commit: 'feat content'
  - name: 'kind/security'
    color: 'b60205'
    description: 'Vulnerability, hardening, or secret exposure'
    supersedes: 'security'
  - name: 'kind/refactor'
    color: '5319e7'
    description: 'Behaviour unchanged, shape improved'
    commit: 'refactor'
  - name: 'kind/docs'
    color: '0075ca'
    description: 'Documentation, comments, AGENTS.md'
    supersedes: 'documentation'
    commit: 'docs'
  - name: 'kind/test'
    color: '1d76db'
    description: 'Test coverage or test infrastructure'
    commit: 'test'
  - name: 'kind/chore'
    color: 'c5def5'
    description: 'Dependencies, CI, tooling, housekeeping'
    supersedes: 'upgrade'
    commit: 'chore ci build perf release'
  - name: 'kind/plan'
    color: 'fbca04'
    description: 'Design or proposal. No code yet'
  - name: 'kind/question'
    color: 'd876e3'
    description: 'Needs an answer before it can be scoped'
    supersedes: 'question'

# Where the work is stuck. Deliberately short: GitHub already models assignee,
# milestone, and review state, and a status label that duplicates one of those
# goes stale the moment someone uses the native field instead.
status:
  - name: 'status/needs-triage'
    color: 'ededed'
    description: 'Not yet scoped or prioritised'
  - name: 'status/blocked'
    color: 'e99695'
    description: 'Waiting on something outside this repository'
  - name: 'status/in-progress'
    color: 'fef2c0'
    description: 'Someone is actively on this'
  # Terminal states. Not kinds -- they say why nobody is working on it, which is
  # the same question the rest of this family answers.
  - name: 'status/duplicate'
    color: 'cfd3d7'
    description: 'Already tracked elsewhere'
    supersedes: 'duplicate'
  - name: 'status/invalid'
    color: 'e4e669'
    description: 'Not a real problem, or not reproducible'
    supersedes: 'invalid'
  - name: 'status/wontfix'
    color: 'ffffff'
    description: 'Understood and deliberately not being fixed'
    supersedes: 'wontfix'

# Where the work is, by top-level group. Mirrors the project globs in
# .moon/workspace.yml.
area:
  - name: 'area/apps'
    color: '006b75'
    description: 'Games and websites under apps/'
  - name: 'area/crates'
    color: '006b75'
    description: 'Rust libraries under crates/'
  - name: 'area/packages'
    color: '006b75'
    description: 'Shared packages under packages/'
  - name: 'area/services'
    color: '006b75'
    description: 'Deployed services under services/'
  - name: 'area/tools'
    color: '006b75'
    description: 'Repository tooling under tools/'

# The moon tag vocabulary. This list is what a `tags:` entry in any moon.yml is
# allowed to say.
#
# moon cannot enforce this itself -- `constraints` only offers
# enforceLayerRelationships and tagRelationships, with no allowlist -- so
# sync.mjs --check does it, and CI runs that. Without it the drift just moves
# one level down: a typo'd tag in a moon.yml would quietly mint a label, and
# `tag/bevy` and `tag/bevvy` would both look official.
#
# Adding a tag is a deliberate line here plus the moon.yml that uses it. A tag
# nobody uses is reported too, so retired ones do not linger as dead labels.
tag:
  - name: 'tag/game'
    color: 'd4c5f9'
    description: 'A playable game project'
  - name: 'tag/bevy'
    color: 'd4c5f9'
    description: 'Bevy engine'
  - name: 'tag/godot'
    color: 'd4c5f9'
    description: 'Godot engine'
  - name: 'tag/phaser'
    color: 'd4c5f9'
    description: 'Phaser engine'
  - name: 'tag/astro'
    color: 'd4c5f9'
    description: 'Astro site'
  - name: 'tag/itch'
    color: 'd4c5f9'
    description: 'Published to itch.io'
  - name: 'tag/npm'
    color: 'd4c5f9'
    description: 'Published to npm'
  - name: 'tag/proto'
    color: 'd4c5f9'
    description: 'Protobuf schemas and generated code'
  - name: 'tag/lfs'
    color: 'd4c5f9'
    description: 'Needs Git LFS assets to build'
  - name: 'tag/windmill'
    color: 'd4c5f9'
    description: 'Windmill scripts and flows'

# Severity, kept under its original bare names rather than prefixed. Declared
# here so the sync owns their colours and descriptions; it is the one family
# that does not carry a prefix.
level:
  - name: '0'
    color: 'fbca04'
    description: 'Neutral Level'
  - name: '1'
    color: 'e7ba04'
    description: 'Level 1'
  - name: '2'
    color: 'c49d03'
    description: 'Level 2'
  - name: '3'
    color: 'c98003'
    description: 'Level 3'
  - name: '4'
    color: 'c97d03'
    description: 'Level 4'
  - name: '5'
    color: 'd93f0b'
    description: 'Level 5'
  - name: '6'
    color: 'b60205'
    description: 'Level 6'

# The only labels the sync deletes, and only ones named here. Both are calls for
# outside contribution, which this repository does not take -- the work arrives
# from the user or an agent, not from a drive-by.
#
# Deleting is deliberate and bounded on purpose: everything not declared above
# and not listed here is reported as unmanaged and left alone.
retire:
  - name: 'help'
    description: 'Contribution signal with no audience here'
  - name: 'good first issue'
    description: 'Contribution signal with no audience here'
