[package]
name = "rentearth-bevy"
description = "Bevy front end for the Rent Earth 4X game."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Off by default, and that default is load-bearing: it is what lets a clone
# without the git-crypt key build. `src/private/**` is encrypted in the
# repository, and rustc never opens a module that is cfg'd out. Turning this on
# without the key fails to compile, which is the honest outcome.
default = []
water = []

# WebGPU for the browser build. Bevy resolves the backend at compile time --
# `webgpu` overrides the default `webgl2` in a cfg rather than falling back at
# runtime, so a single wasm binary speaks exactly one of them. Reaching
# browsers without WebGPU therefore means a second bundle with this feature
# off; build-web.sh produces both and index.html picks on navigator.gpu.
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = "0.19.1"

# The worker pool behind the browser build. Native builds do not need it: Bevy
# already runs its schedule on a thread pool there, and this crate's desktop
# path would only add a second one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_tasker = { path = "../../../crates/bevy_tasker" }
