# The 4X game. Rust and Bevy, targeting native for development and a threaded
# WebGPU build in the browser for release, with a WebGL2 bundle beside it for
# browsers that cannot run the first. Both browser bundles need cross-origin
# isolation on the page; see tools/build-web.sh.
layer: 'application'
language: 'rust'
stack: 'frontend'
tags: ['bevy', 'game', 'lfs', 'itch']

owners:
  defaultOwner: '@h0lybyte'

# The one fact the project graph cannot answer: the itch page slug lives on
# itch, not in this repository, and this project ships to a page called
# `rentearth`. itch treats a wasm-bindgen bundle and a Vite one the same way,
# so the channel is still `html`.
env:
  ITCH_TARGET: 'kbve/rentearth:html'

tasks:
  # The browser bundles. Inherited `build` stays native: CI compiles that on
  # every change, and cross-compiling to wasm as well would treble the slowest
  # task in the pipeline -- there are two wasm binaries -- for something only a
  # release consumes.
  build-web:
    command: 'bash ./tools/build-web.sh'
    deps:
      # The water textures are LFS objects. Inherited `assets` hangs off the
      # 'lfs' tag's `build`, which is the native one -- without naming it here
      # the browser bundle ships pointer files as textures and the game gets
      # placeholder water.
      - '~:assets'
      - '~:wasm-bindgen'
      - '~:wasm-toolchain'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'web/**/*'
      - 'tools/build-web.sh'
      - 'tools/wasm-toolchain.txt'
      - 'Cargo.toml'
      - '/Cargo.lock'
    outputs:
      - 'dist'

  # build-web.sh refuses to run on a CLI that does not match the wasm-bindgen
  # crate in Cargo.lock, because the mismatch produces a bundle that fails at
  # import with no useful message. This installs the matching one.
  wasm-bindgen:
    command: 'bash ./tools/ensure-wasm-bindgen.sh'
    inputs:
      - 'tools/ensure-wasm-bindgen.sh'
      - '/Cargo.lock'
    options:
      cache: false

  # The threaded browser build rebuilds the standard library with atomics, which
  # is nightly-only. Installed here rather than in the release workflow for the
  # same reason as wasm-bindgen: one project's need does not belong in a file
  # every project shares.
  wasm-toolchain:
    command: 'bash ./tools/ensure-wasm-toolchain.sh'
    inputs:
      - 'tools/ensure-wasm-toolchain.sh'
      - 'tools/wasm-toolchain.txt'
    options:
      cache: false

  # Inherited from the 'bevy' tag, which supplies the command. Named here for
  # the two things it cannot know: the water is behind a feature flag, and the
  # textures are LFS objects -- without the blobs the sea renders as Bevy's
  # placeholder rather than as water.
  #
  # Set RENTEARTH_SCREENSHOT to a path to capture one settled frame and quit,
  # which is how a shader change gets compared against the one before it.
  run:
    args: '--features water,units,trees'
    deps:
      - '~:assets'

  # Local only. The threaded bundles need cross-origin isolation, so the usual
  # `python3 -m http.server` in dist/ reproduces a failure the deployment does
  # not have.
  serve-web:
    command: 'bash ./tools/serve-web.sh'
    deps:
      - '~:build-web'
    # Long-running and interactive: never cached, never run in CI.
    preset: 'server'

  # Ships what build-web emits, not what `build` does: `build` stays native so
  # CI does not cross-compile two wasm binaries on every change.
  #
  # `test` is a dependency rather than a separate CI concern because itch.yml
  # runs this task and nothing else -- a game that compiled to wasm but failed
  # every test published cleanly, which is the one failure a release must not
  # have. fish-and-chip and gilded-gazette already gate their publish on
  # `~:build` and `~:e2e`; this is the same rule for a project with neither.
  #
  # Worth knowing what it does not cover: `test` compiles with the default
  # feature set, which is empty, while build-web compiles the private modules.
  # It gates the shared code, not the encrypted half.
  publish:
    deps:
      - '~:build-web'
      - '~:test'
