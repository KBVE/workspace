# The 4X game. Rust and Bevy, targeting native for development and a
# single-threaded WebGPU build in the browser for release, with a WebGL2
# bundle beside it for browsers that cannot run the first.
layer: 'application'
language: 'rust'
stack: 'frontend'
tags: ['bevy', 'game', 'lfs', 'itch']

owners:
  defaultOwner: '@h0lybyte'

# The one fact the project graph cannot answer: the itch page slug lives on
# itch, not in this repository, and this project ships to a page called
# `rentearth`. itch treats a wasm-bindgen bundle and a Vite one the same way,
# so the channel is still `html`.
env:
  ITCH_TARGET: 'kbve/rentearth:html'

tasks:
  # The browser bundles. Inherited `build` stays native: CI compiles that on
  # every change, and cross-compiling to wasm as well would treble the slowest
  # task in the pipeline -- there are two wasm binaries -- for something only a
  # release consumes.
  build-web:
    command: 'bash ./tools/build-web.sh'
    deps:
      # The water textures are LFS objects. Inherited `assets` hangs off the
      # 'lfs' tag's `build`, which is the native one -- without naming it here
      # the browser bundle ships pointer files as textures and the game gets
      # placeholder water.
      - '~:assets'
      - '~:wasm-bindgen'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'web/**/*'
      - 'tools/build-web.sh'
      - 'Cargo.toml'
      - '/Cargo.lock'
    outputs:
      - 'dist'

  # build-web.sh refuses to run on a CLI that does not match the wasm-bindgen
  # crate in Cargo.lock, because the mismatch produces a bundle that fails at
  # import with no useful message. This installs the matching one.
  wasm-bindgen:
    command: 'bash ./tools/ensure-wasm-bindgen.sh'
    inputs:
      - 'tools/ensure-wasm-bindgen.sh'
      - '/Cargo.lock'
    options:
      cache: false

  # Ships what build-web emits, not what `build` does: `build` stays native so
  # CI does not cross-compile two wasm binaries on every change.
  publish:
    deps:
      - '~:build-web'
