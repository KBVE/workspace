<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Rent Earth</title>
    <style>
      /* itch serves this in an iframe, so the page has to fill whatever box it
         is given rather than assuming a viewport. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #e8ecf4;
        font: 14px/1.5 system-ui, sans-serif;
      }

      /* Bevy appends its own canvas to the body. Sizing it here rather than
         from Rust keeps the layout in one place. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        /* The map is made of flat-shaded hexes; smoothing on upscale reads as
           blur rather than as detail. */
        image-rendering: pixelated;
      }

      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 1.5rem;
      }

      #title {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #stage {
        opacity: 0.75;
      }

      /* Reserves its line so the layout does not jump when text appears. */
      #detail {
        opacity: 0.45;
        font-size: 12px;
        min-height: 1.5em;
        max-width: 34rem;
      }

      #bar {
        width: min(22rem, 70vw);
        height: 3px;
        border-radius: 3px;
        background: #1b2233;
        overflow: hidden;
      }

      #fill {
        height: 100%;
        width: 0;
        background: #5b8cff;
        transition: width 0.2s linear;
      }

      #boot.failed #title,
      #boot.failed #stage {
        color: #ff9a9a;
      }

      #boot.failed #bar {
        display: none;
      }

      /* Only shown on failure: the copyable detail behind the summary. */
      #trace {
        display: none;
        max-width: min(46rem, 88vw);
        max-height: 30vh;
        overflow: auto;
        text-align: left;
        font: 11px/1.45 ui-monospace, monospace;
        background: #0b1020;
        border: 1px solid #1b2233;
        border-radius: 4px;
        padding: 0.6rem 0.75rem;
        white-space: pre-wrap;
        opacity: 0.8;
      }

      #boot.failed #trace {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Replaced by the canvas once the game starts. Every stage names itself:
         "stuck on Loading" is not a report anyone can act on. -->
    <div id="boot">
      <div id="title">Rent Earth</div>
      <div id="stage">starting</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="detail"></div>
      <div id="trace"></div>
    </div>

    <script type="module">
      const boot = document.getElementById('boot');
      const stageEl = document.getElementById('stage');
      const detailEl = document.getElementById('detail');
      const traceEl = document.getElementById('trace');
      const fillEl = document.getElementById('fill');

      const params = new URLSearchParams(location.search);
      // Forcing a backend makes a bug report reproducible.
      const forced = params.get('backend');
      // Set by the WebGPU attempt before it reloads, so a second failure
      // reports rather than looping.
      const isRetry = params.get('retry') === '1';

      let stage = 'starting';
      const setStage = (name, detail = '') => {
        stage = name;
        stageEl.textContent = name;
        detailEl.textContent = detail;
      };
      const setProgress = (fraction) => {
        fillEl.style.width = `${Math.max(0, Math.min(1, fraction)) * 100}%`;
      };

      const fail = (summary, trace) => {
        boot.className = 'failed';
        stageEl.textContent = summary;
        detailEl.textContent = `failed while: ${stage}`;
        traceEl.textContent = [
          trace,
          '',
          `backend: ${forced ?? 'auto'}`,
          `crossOriginIsolated: ${self.crossOriginIsolated}`,
          `SharedArrayBuffer: ${typeof SharedArrayBuffer}`,
          `navigator.gpu: ${typeof navigator.gpu}`,
          `page: ${location.href}`,
          `top-level: ${self === self.top}`,
          `ua: ${navigator.userAgent}`,
        ].join('\n');
      };

      // requestAdapter can simply never settle in a cross-origin iframe, and
      // an await on it leaves the page saying "loading" with nothing logged.
      const withTimeout = (promise, ms, what) =>
        Promise.race([
          promise,
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error(`${what} did not respond within ${ms}ms`)), ms),
          ),
        ]);

      // Bevy compiles its wgpu backend in, so the two backends are separate
      // binaries and only one is fetched. An adapter is not enough to commit:
      // a device request can still fail, and that failure would otherwise
      // arrive after the download, as a blank canvas.
      async function pickBackend() {
        if (forced) return forced;
        if (!navigator.gpu) return 'webgl2';

        try {
          const adapter = await withTimeout(navigator.gpu.requestAdapter(), 8000, 'requestAdapter');
          if (!adapter) return 'webgl2';
          const device = await withTimeout(adapter.requestDevice(), 8000, 'requestDevice');
          if (!device) return 'webgl2';
          // Released immediately; Bevy asks for its own. This was only ever a
          // question, not a resource we intend to keep.
          device.destroy?.();
          return 'webgpu';
        } catch (error) {
          // A browser that cannot answer about WebGPU can still run WebGL2.
          console.warn('rentearth: WebGPU probe failed, using WebGL2', error);
          return 'webgl2';
        }
      }

      // Resolves once Bevy's canvas exists and the browser has had two frames
      // to paint it, so the overlay is not pulled away onto a blank rectangle.
      function canvasPainted() {
        const seen = (canvas) =>
          new Promise((resolve) =>
            requestAnimationFrame(() => requestAnimationFrame(() => resolve(canvas))),
          );

        const existing = document.querySelector('canvas');
        if (existing) return seen(existing);

        return new Promise((resolve) => {
          const observer = new MutationObserver(() => {
            const canvas = document.querySelector('canvas');
            if (canvas) {
              observer.disconnect();
              seen(canvas).then(resolve);
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        });
      }

      // Streams the wasm so the bar reflects bytes, handing wasm-bindgen a
      // Response it can still compile as it arrives. Without a Content-Length
      // there is nothing to divide by, so the original Response is returned.
      async function fetchWasm(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${response.status} ${response.statusText} fetching ${url}`);

        const total = Number(response.headers.get('Content-Length') || 0);
        if (!total || !response.body) return response;

        let loaded = 0;
        const mib = (n) => `${(n / 1048576).toFixed(1)} MiB`;
        const stream = new ReadableStream({
          start(controller) {
            const reader = response.body.getReader();
            const pump = () =>
              reader.read().then(({ done, value }) => {
                if (done) return controller.close();
                loaded += value.byteLength;
                setProgress(loaded / total);
                setStage('downloading', `${mib(loaded)} of ${mib(total)}`);
                controller.enqueue(value);
                return pump();
              });
            pump().catch((error) => controller.error(error));
          },
        });

        return new Response(stream, { headers: { 'Content-Type': 'application/wasm' } });
      }

      try {
        // The shared memory the bundles import cannot be constructed without
        // isolation. Checked before the fetch, or the failure arrives tens of
        // megabytes later as a DataCloneError from inside generated glue.
        setStage('checking browser support');
        if (!self.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
          fail(
            'This page is not cross-origin isolated.',
            'Rent Earth is a threaded build and needs SharedArrayBuffer, which a\n' +
              'browser only exposes on a page served with COOP and COEP headers.\n' +
              'Safari does not accept the "credentialless" form of COEP that some\n' +
              'hosts send, so the same build can work in Chrome and not here.',
          );
          throw new Error('not cross-origin isolated');
        }

        setStage('choosing renderer');
        const backend = await pickBackend();

        setStage('downloading', 'first load fetches a large bundle');
        setProgress(0.02);
        const wasm = await fetchWasm(`./rentearth-${backend}_bg.wasm`);

        setStage('starting renderer', backend);
        setProgress(1);
        const { default: init } = await import(`./rentearth-${backend}.js`);

        // Not awaited as the signal that the game started. `App::run` never
        // returns -- wasm-bindgen unwinds it by throwing -- and what init()'s
        // promise then does is browser-specific: Chromium rejects it, Safari
        // leaves it pending forever. Awaiting it there holds the overlay over
        // a game already running at full speed. The canvas appearing is the
        // honest signal.
        const running = init({ module_or_path: wasm });
        running.catch((error) => {
          if (!`${error}`.includes('control flow')) throw error;
        });

        await Promise.race([
          canvasPainted(),
          running.then(() => {}),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error('no canvas appeared within 30s of starting')), 30000),
          ),
        ]);

        boot.remove();
      } catch (error) {
        // The unwind above surfaces here on some browsers. Not a failure.
        if (`${error}`.includes('control flow')) {
          boot.remove();
        } else if (boot.className !== 'failed') {
          // A WebGPU device can be granted and still fail once Bevy asks it
          // for real work -- exactly when WebGL2 would have rendered.
          if (!forced && !isRetry) {
            setStage('retrying with WebGL2', `${error}`);
            params.set('backend', 'webgl2');
            params.set('retry', '1');
            location.replace(`${location.pathname}?${params}`);
          } else {
            fail(`${error}`, error?.stack ?? String(error));
          }
        }
        console.error('rentearth: startup failed', error);
      }
    </script>
  </body>
</html>
