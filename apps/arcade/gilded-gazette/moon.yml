# A Godot 4 game with a React front end. Three runtimes in one project, in a
# fixed order: shared/ compiles into both godot/ and vite/, the Godot web export
# lands in vite/public/godot, then vite builds around it. CMakeLists.txt encodes
# the same order for a local `cmake --build build --target ci`.
#
# The web layer still carries its own package.json and package-lock.json under
# vite/, outside the pnpm workspace globs. It is an npm island on purpose for
# now -- adopting the catalog means moving it onto pnpm, which is a separate
# change from landing the code.
layer: 'application'
language: 'typescript'
stack: 'frontend'
tags: ['godot', 'game', 'lfs', 'itch']

owners:
  defaultOwner: '@h0lybyte'

# The one fact the project graph cannot answer: the itch page slug lives on
# itch, not here. ITCH_DIST because this project's web build is a subdirectory
# -- the vite root is not the project root.
env:
  ITCH_TARGET: 'kbve/gilded-gazette:html'
  ITCH_DIST: 'vite/dist'

fileGroups:
  # The contract: edited by hand, compiled into both runtimes. Anything here
  # invalidates every generated output on both sides.
  contract:
    - 'shared/state.json'
    - 'shared/events.json'
    - 'shared/data/**/*'
  generators:
    - 'tools/*.mjs'

tasks:
  # vite/ is an npm island outside the pnpm workspace globs, so moon's own
  # install does not reach it and every task here that runs npm has to depend
  # on this one. It runs in CI for the same reason: without it a runner has no
  # node_modules under vite/ and the first npm script fails on a missing vite.
  install:
    command: 'npm --prefix vite ci'
    options:
      cache: false
    inputs:
      - 'vite/package-lock.json'
      - 'vite/package.json'

  # The web export templates. proto pins the editor itself (.prototools) and
  # moon installs it; the templates unpack outside proto's tool directory, so
  # they need a fetch of their own -- see .proto/plugins/godot.toml.
  #
  # Exporting without them does not fail loudly: Godot reports a missing
  # template and writes nothing, so the vite build that follows finds an empty
  # public/godot and ships a page with no game in it.
  export-templates:
    command: 'bash ./tools/ensure-export-templates.sh'
    inputs:
      - 'tools/ensure-export-templates.sh'
      - '/.prototools'
    options:
      cache: false

  # shared/ -> godot/scripts/ecs/*.gd and vite/src/**. Never edit the outputs.
  gen:
    command: 'npm --prefix vite run gen'
    deps:
      - '~:install'
    inputs:
      - '@group(contract)'
      - '@group(generators)'

  # CI's real gate: fails when a committed generated file has drifted from
  # shared/. Read-only, so it is the one safe to run everywhere.
  gen-check:
    command: 'npm --prefix vite run gen:check'
    deps:
      - '~:install'
    inputs:
      - '@group(contract)'
      - '@group(generators)'
      - 'godot/scripts/ecs/**/*.gd'
      - 'vite/src/**/*'

  # Vite against whatever is already in public/godot. Rebuilding the export as
  # well is `npm --prefix vite run dev:full`, which is a minute-plus and not
  # what you want when the change is in React.
  dev:
    command: 'npm --prefix vite run dev'
    deps:
      - '~:install'
    preset: 'server'

  typecheck:
    command: 'npm --prefix vite run typecheck'
    deps:
      - '~:install'
    inputs:
      - 'vite/src/**/*'
      - 'vite/tsconfig*.json'

  # The whole artifact, in the one order that works: shared/ generates into both
  # runtimes, Godot exports into vite/public/godot, then vite builds around
  # what is there. Depending on build-godot is what makes `build` mean the game
  # rather than the page it is mounted in -- an itch release runs this task and
  # nothing else.
  build:
    command: 'npm --prefix vite run build'
    deps:
      - '~:gen'
      - '~:build-godot'
    inputs:
      - 'vite/src/**/*'
      - 'vite/index.html'
      - 'vite/vite.config.ts'
      - 'vite/tsconfig*.json'
    outputs:
      - 'vite/dist'

  # Everything below shells out to a Godot binary with the export templates
  # installed, and the character art has to be smudged from Forgejo first (see
  # the repo-root .lfsconfig). Neither used to be true of a bare CI runner, so
  # these were opted out of `moon ci` -- which meant nothing ever checked that
  # the game builds. Both are tasks now: `export-templates` completes what
  # proto's editor pin cannot, and `assets` comes from the 'lfs' tag. A runner
  # needs no more than a Forgejo credential.
  build-shell:
    command: 'npm --prefix vite run build:shell'
    deps:
      - '~:install'
    inputs:
      - 'vite/src/**/*'
      - 'vite/vite.shell.config.ts'
    outputs:
      - 'godot/web/shell.html'

  # &shell -> build:shell emits godot/web/shell.html, which the export template
  #           consumes, so it has to run before the export and not after.
  # &assets -> the cast models are LFS objects. Inherited `assets` hangs off
  #            `build`, and moon runs a task's deps in parallel, so the export
  #            has to name it or it can start before the blobs are there and
  #            bake pointer files into the pck.
  build-godot:
    command: 'npm --prefix vite run build:godot'
    options:
      cache: false
    deps:
      - '~:install'
      - '~:export-templates'
      - '~:assets'
      - '~:build-shell'
    outputs:
      - 'vite/public/godot'

  test-godot:
    command: 'npm --prefix vite run test:godot'
    options:
      cache: false
    deps:
      - '~:install'
      - '~:export-templates'

  # Playwright ships no browser with the npm package. A task so that e2e can
  # depend on it rather than every caller remembering.
  e2e-browser:
    command: 'npm --prefix vite exec -- playwright install --with-deps chromium'
    deps:
      - '~:install'
    options:
      cache: false

  # Boots the exported game in a real browser. gdUnit4 runs against the engine
  # with no web export in sight, so this is the only check that proves the
  # thing that ships starts at all.
  #
  # Not `runInCI: false`, which would read as "release-only" but means moon
  # skips it in any CI environment -- including when the release workflow asks
  # for it by name, so the gate would silently never run.
  e2e:
    command: 'npm --prefix vite run e2e'
    options:
      cache: false
    deps:
      - '~:build'
      - '~:e2e-browser'

  # What ships and what gates it.
  publish:
    deps:
      - '~:build'
      - '~:e2e'
