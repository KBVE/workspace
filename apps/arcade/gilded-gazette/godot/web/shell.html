a/locations/cabin.mdx`},{id:`corridor`,name:`The Corridor`,carriage:2,furnishings:[],lede:`Feels about a yard wide, just enough room to avoid a leg cramp but it is a full length of the train. And the only way from any berth to any other.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Windows down one side, doors down the other, and a runner of carpet that shows every step taken on it while the rain was falling.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`Nobody stays in the corridor. Everybody crosses it. Whoever was where, they were here first.`],bullets:[]}},source:`shared/data/locations/corridor.mdx`},{id:`dining`,name:`The Dining Car`,carriage:1,furnishings:[{along:-5.4,across:1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:-4.74,across:1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-6.06,across:1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-1.8,across:1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:-1.14,across:1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-2.46,across:1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:1.8,across:1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:2.46,across:1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:1.14,across:1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:5.4,across:1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:6.06,across:1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:4.74,across:1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-5.4,across:-1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:-4.74,across:-1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-6.06,across:-1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-1.8,across:-1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:-1.14,across:-1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-2.46,across:-1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:1.8,across:-1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:2.46,across:-1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:1.14,across:-1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:5.4,across:-1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:6.06,across:-1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:4.74,across:-1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48}],lede:`Eight tables, six of them laid, and a steward who remembers what everyone drinks without being told.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`White cloth, brass rail, and the window glass gone black by eight o'clock so the car dines looking at itself.`],bullets:[]},service:{heading:`Service`,paragraphs:[`The last order is taken at half past nine and the car is dark by ten. Anyone still seated after that was not eating.`],bullets:[]}},source:`shared/data/locations/dining.mdx`},{id:`guard_van`,name:`The Guard's Van`,carriage:0,furnishings:[{along:-6.4,across:1.15,above:0,facing:0,prop:`crate`,surfaceHeight:.55},{along:-5.6,across:1.15,above:0,facing:.35,prop:`crate`,surfaceHeight:.55},{along:6.6,across:-1.15,above:0,facing:0,prop:`crate`,surfaceHeight:.55},{along:6.9,across:1.05,above:0,facing:1.5708,prop:`lockbox`,surfaceHeight:.45}],lede:`Last car of the consist, and the only one with a door that opens onto nothing but weather.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Crates roped to the wall, a stove nobody has lit, and the guard's ledger open on a nail. The lamp swings wider here than anywhere forward, which is how you know you have reached the end of the train.`],bullets:[]},what_is_kept_here:{heading:`What Is Kept Here`,paragraphs:[`Everything nobody wanted in their berth. The ledger records what was loaded at Paris and what was loaded at Calais, and the two hands do not match.`],bullets:[]}},source:`shared/data/locations/guard_van.mdx`},{id:`kitchen`,name:`The Kitchen`,carriage:6,furnishings:[{along:-6.4,across:1.15,above:0,facing:0,prop:`crate`,surfaceHeight:.55},{along:-5.6,across:1.15,above:0,facing:.35,prop:`crate`,surfaceHeight:.55},{along:6.9,across:1.05,above:0,facing:1.5708,prop:`lockbox`,surfaceHeight:.45}],lede:`Four feet of working room between the stores and the range, and staff only, in theory.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Stores crated against one wall, the plate locked away against the other, and a range that has been out since the last cover went forward.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`Everything anybody ate or drank tonight came through here, and the door to it does not lock -- it fastens, which is a different thing that everybody aboard has been told is the same thing.`],bullets:[]}},source:`shared/data/locations/kitchen.mdx`},{id:`mail`,name:`The Mail Van`,carriage:7,furnishings:[{along:6.6,across:-1.15,above:0,facing:0,prop:`crate`,surfaceHeight:.55},{along:-6.4,across:1.15,above:0,facing:0,prop:`crate`,surfaceHeight:.55},{along:6.9,across:1.05,above:0,facing:1.5708,prop:`lockbox`,surfaceHeight:.45}],lede:`Sealed at Calais under a different authority to the rest of the train, and carrying post for three countries.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Sacks in crates, a sorting shelf nobody has used since the border, and a seal on the far door that is a customs matter rather than a railway one.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`The one room aboard the guard has no key to. Whatever is in here was put in at Calais by somebody who does not work for this company, and will be taken out at Vienna by somebody else who does not.`],bullets:[]}},source:`shared/data/locations/mail.mdx`},{id:`platform`,name:`The Platform`,furnishings:[],lede:`Not aboard at all. Where the passengers were before they were passengers, and the only place the enquiry cannot follow them.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Gas lamps at intervals, a clock two minutes fast, and porters who have already gone home.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`Everyone boarded somewhere. What they were carrying when they did is a question the manifest answers and the passengers do not.`],bullets:[]}},source:`shared/data/locations/platform.mdx`},{id:`salon`,name:`The Salon Car`,carriage:5,furnishings:[{along:-5.4,across:1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:-4.74,across:1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:-6.06,across:1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:1.8,across:-1.1,above:0,facing:0,prop:`dining_table`,surfaceHeight:.7525},{along:2.46,across:-1.1,above:0,facing:1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48},{along:1.14,across:-1.1,above:0,facing:-1.5708,prop:`dining_chair`,seats:!0,cushionHeight:.48}],lede:`Where the company would like you to sit after dinner, and where nobody sits alone.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Two tables, four chairs, and a great deal of room between them that the company charges for. The lamps are turned up higher here than anywhere else aboard.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`It is the only room on the train designed to be sat in by people who did not arrive together, which makes it the only room where being seen with somebody means nothing at all.`],bullets:[]}},source:`shared/data/locations/salon.mdx`},{id:`smoking`,name:`The Smoking Room`,carriage:9,furnishings:[],lede:`Six seats, a window that opens, and the smell of every journey this carriage has made since it left the works.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Dark, unlit, and unused tonight. The window is down two inches, which somebody did and nobody has undone.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`It is the far end of the train. Everything that happened aboard tonight happened between here and the guard's van, and nobody had a reason to come this far.`],bullets:[]}},source:`shared/data/locations/smoking.mdx`},{id:`vestibule`,name:`The Vestibule`,carriage:4,furnishings:[],lede:`The joint between cars, where the floor moves under you and conversation is impossible.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Concertina walls, a handrail worn bright, and a door to the trackside that is supposed to be locked while the train is moving.`],bullets:[]},why_it_matters:{heading:`Why It Matters`,paragraphs:[`The loudest six feet on the train, which makes it the only place aboard where two people can speak and be certain of not being overheard.`],bullets:[]}},source:`shared/data/locations/vestibule.mdx`}],articles:[{id:`aisle_midnight`,when:{level:`Aisle`,after:`23:00`,before:`03:00`},priority:10,kicker:`Stop Press`,title:`Lamps Found Extinguished End to End`,caption:`The aisle after midnight, lamps cold.`,lede:`The conductor, with a face of confusion, insisted the lamps were trimmed at eight.`,body:[`Yet no passenger admits to having passed that way since, and the corridor now lies dark from vestibule to vestibule.`,`Our correspondent walked its length twice and met no one, which he notes is itself remarkable on a train carrying forty-one souls.`,`As the wind continued to howl, the conductor became increasingly agitated and emotional distraught.`,`Questions concerning the lamps are now met not with answers, but accusations, curses, and theories implicating nearly every demon aboard.`],sections:{},source:`shared/data/articles/aisle_midnight.mdx`},{id:`aisle_woman`,when:{level:`Aisle`},priority:0,kicker:`Aboard the Express`,title:`Mysterious Woman Seen Walking the Aisle`,caption:`The aisle of Car No. 7, looking forward.`,lede:`Railway employees report unusual activity shortly after midnight, and the steward is unable to account for a second setting laid at table nine.`,body:[`The steward maintains that the fourth chair was drawn out before the soup, and that no one sat in it.`,`> "I did not lay it," he told our correspondent. "But the chair was drawn out before the soup came, as though someone had already taken her seat."`,`A porter questioned afterward disputed the steward’s account, but became visibly uneasy when asked whether he had seen anyone in the aisle.`,`> "I saw somebody," he said. "That is not the same thing."`,`He would say no more.`,`Several passengers later reported seeing a woman walking alone toward the forward vestibule shortly after midnight. No description agrees beyond this: she wore dark clothing, moved without haste, and was not seen returning.`,`Passengers were thereafter asked to remain in their compartments until the border and to report any door found unlocked that ought not to have been.`],sections:{},source:`shared/data/articles/aisle_woman.mdx`},{id:`departure`,when:{boot:!0},priority:0,kicker:`Late Extra`,title:`The Continental Express Departs Under Cover of Rain`,caption:`The platform, moments before departure.`,lede:`The Continental Express departed through a hard evening rain, the platform heavy with the smell of wet timber, musky tobacco, coal smoke, and hot iron. Glisening, the lamps were already burning against the weather and the station nearly deserted by the time the last whistle sounded.`,body:[`Boarding was otherwise without incident, save for two small irregularities which railway officials have thus far been unable to explain: one berth appears to have been claimed by two passengers, while a trunk was found aboard which no porter remembers carrying. Our correspondent, travelling in Car No. 7, observed the guard make two complete examinations of the train after departure. On the second occasion he was heard asking a steward, in some irritation,`,`> "Then where is the other one?"`,`The steward gave no answer within our hearing.`,`At the last halt, the stationmaster declined to discuss the matter and ordered the platform cleared before the train resumed its journey. Railway officials continue their enquiries. Any passenger possessing knowledge of the disputed berth, the unidentified luggage, or the person to whom either may belong is requested to present themselves to the conductor before the border crossing.`,`Passengers boarded without incident, though the guard reports one berth claimed twice and a trunk no porter admits to carrying.`,`Our correspondent, travelling in Car No. 7, reports that the guard has twice walked the length of the train without satisfying himself as to the whereabouts of the missing party. The stationmaster at the last halt declined to comment.`,`Enquiries continue. Any passenger with knowledge of the affair is asked to present themselves at the conductor's office before the border crossing.`],sections:{},source:`shared/data/articles/departure.mdx`},{id:`orbit_circled`,when:{level:`Orbit`},priority:0,kicker:`From the Trackside`,title:`The Whole Carriage Circled by Our Photographer`,caption:`The carriage, circled at speed.`,lede:`A circuit of the carriage made from the trackside disclosed several particulars not apparent from within.`,body:[`One window stood unlatched. Beneath it, on the rain-darkened paintwork, our photographer found the distinct mark of a hand. Farther along, a lamp still burned behind the curtain of a berth whose occupant insisted it had been extinguished before midnight.`,`A full turn about the coach reveals a window unlatched from within and a lamp still burning in a berth its occupant swears was dark.`,`From the trackside the coach gives up what its corridors hide: one window unlatched, and the mark of a hand below it on the paintwork.`,`The railway declines to say whether the train was stopped between halts. Our photographer, who was standing beside it, says it was.`],sections:{},source:`shared/data/articles/orbit_circled.mdx`},{id:`side_cutaway`,when:{level:`Side`},priority:0,kicker:`Cutaway Edition`,title:`Near Wall Removed: The Compartments Laid Bare`,caption:`Car No. 7 in section, near wall removed.`,lede:`With the trackside wall cut away, every compartment can be read at once. Our readers are invited to draw their own conclusions.`,body:[`Presented in section, the coach reads as a row of small rooms, each with its own account of the night, and no two accounts agreeing.`,`The Gazette offers no verdict. It offers the plan of the carriage, the hour of each movement, and the names of those aboard.`],sections:{},source:`shared/data/articles/side_cutaway.mdx`}],passengers:[{id:`beaumont`,name:`Lady Beaumont`,listed:`Lady Beaumont`,role:`Widow of the late Sir Rupert Beaumont`,berth:`Car No. 7, berth 1`,boarded:{at:`18:15`,where:`Calais`},location:`cabin`,traits:[`imperious`,`travels without a maid`,`answers a question with a question`],relationships:[{who:`weiss`,tie:`Denies knowing him; addressed him by name at the barrier.`},{who:`carrow`,tie:`Interviewed her for a position in the spring, and did not offer it.`}],alibis:[{says:[`Says she went up at nine and did not come down`,`Says she has never had cause to go near the guard's van`,`Says the corridor was quiet, and she would have heard it`],claims:[{where:`cabin`,never:!1,from:`21:00`},{where:`guard_van`,never:!0}]},{says:[`Says she sat on in the dining car long after the service`,`Says she wanted the company and did not get it`,`Says the steward will remember her, and he does`],claims:[{where:`dining`,never:!1,from:`21:30`}]},{says:[`Says she walked the corridor because she could not settle`,`Says she passed nobody, which she offers as though it helps`,`Says she was never once in her own compartment before midnight`],claims:[{where:`corridor`,never:!1,from:`22:00`},{where:`cabin`,never:!0}]}],sightings:{salon:[`In the good chair with her back to the room, which is the one chair that has one.`,`Sitting where the lamps are turned up, and not reading.`],cabin:[`The lamp still burning, and the door not quite shut.`,`Seated with her back to the window, gloves still on.`],corridor:[`Walking the length of the car, slowly, as though the walk were the point.`,`Standing at a window with nothing outside it but rain.`],dining:[`At a table laid for two, with the second place cleared away unused.`,`Taking nothing, and taking a long time over it.`],guard_van:[`Beside a trunk with no label, which she does not touch and does not leave.`],platform:[`Boarding ahead of the general call, past a porter who is not thanked.`]},lede:`Travelling without a maid, which the conductor notes and does not explain.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Mourning black of a cut three seasons old, worn as though it were this year's. A jet brooch at the throat, and gloves she does not remove, not for dinner and not for the customs officer.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Whatever she says she was doing, she says it once and does not enlarge on it. Lady Beaumont has been asked three times now and has given the same length of answer each time, to the word.`],bullets:[]},what_the_guard_says:{heading:`What the Guard Says`,paragraphs:[`Her trunk was carried aboard by no porter anyone can name, and it went into the van without a label. He is certain of both things and will say neither in front of her.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`The brooch is jet, which is mourning wear. The ring beneath the left glove is not, and she has worn it since Calais.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`Still gloved, which she was not at dinner, and wearing the rings she is said never to take off. Sir Rupert's case was found closed and latched with the second recess in it empty, and nobody has said what the second recess was cut for.`,`Whoever it was, she had turned to face them. Lady Beaumont did not die with her back to anybody.`],bullets:[]}},source:`shared/data/passengers/beaumont.mdx`},{id:`carrow`,name:`Amelia Carrow`,listed:`Miss A. Carrow`,role:`Lady's companion, between positions`,berth:`Car No. 7, berth 6`,boarded:{at:`18:48`,where:`Calais`},location:`cabin`,traits:[`a light sleeper by trade`,`will not name her employer`,`notices what she is not meant to`],relationships:[{who:`beaumont`,tie:`Was interviewed by her in the spring, and not engaged.`}],alibis:[{says:[`Says she heard a door in the small hours`,`Says it was not her own`,`Says she did not look`],claims:[{where:`cabin`,never:!1,from:`22:00`}]},{says:[`Says she was in the corridor most of the evening`,`Says a companion between positions has nowhere else to be`,`Says she saw who passed, and will not say who`],claims:[{where:`corridor`,never:!1,from:`21:00`}]},{says:[`Says she took her dinner late and alone`,`Says nobody joined her, which she did not expect`,`Says she stayed until the lamps went down`],claims:[{where:`dining`,never:!1,from:`20:30`}]}],sightings:{salon:[`On the edge of a chair not her own, waiting to be needed by somebody.`],cabin:[`Awake with the lamp out, which is not the same as asleep.`,`Sitting up at the sound of a door that is not hers.`],corridor:[`Fetching water, and taking the long way back past the berths.`,`Standing aside for someone, and watching which door they take.`],dining:[`At the end table, eating quickly, dressed to be looked past.`,`Waiting to be spoken to by somebody who does not.`],platform:[`Boarding alone with a case borrowed from someone taller.`]},lede:`A companion by profession, returning to an employer she will not name.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Neat, plain, and dressed to be looked past, which she has made a professional skill.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`She answers plainly and at once, which the enquiry has found harder to sit with than hesitation would have been. A companion between positions has learned to be asked things.`],bullets:[]},what_she_heard:{heading:`What She Heard`,paragraphs:[`A door, then a pause too long for someone passing through, then the same door again. She places it at one, and she is a light sleeper by trade.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`She will not name her employer, and the position she is returning to was filled in June.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`Dressed as she was at eight, because she has worn the same grey since Calais and nobody could have said otherwise. No jewellery, no bag, and the position she was last between is still between.`,`She had been overlooked all evening by everybody aboard, and was overlooked once more for some hours after it stopped mattering.`],bullets:[]}},source:`shared/data/passengers/carrow.mdx`},{id:`dupont`,name:`Marcel Dupont`,listed:`M. Dupont`,role:`Commercial traveller, aboard since Paris`,berth:`Car No. 7, berth 8`,boarded:{at:`16:05`,where:`Paris`},location:`dining`,traits:[`known to the guard by name`,`keeps an appointment book`,`pays for his own wine`],relationships:[{who:`thompson`,tie:`Shared a table by chance, and talked business neither seems to conduct.`}],alibis:[{says:[`Says he dined at eight, as always`,`Says he waited for a colleague who did not come, and waited past any hour a colleague would have come`,`Says he was still at his table when the lamps went down`],claims:[{where:`dining`,never:!1,from:`20:00`}]},{says:[`Says he took no dinner at all tonight, which is not like him`,`Says he was in the corridor from ten, on his feet`,`Says a man with an appointment does not sit down`],claims:[{where:`corridor`,never:!1,from:`22:00`},{where:`dining`,never:!0}]},{says:[`Says he went to his berth early with the book`,`Says the entry in it is not his hand and he cannot account for it`,`Says he did not leave the compartment after nine`],claims:[{where:`cabin`,never:!1,from:`21:00`}]}],sightings:{salon:[`Holding the room the way a commercial traveller holds a room, and selling nothing.`],dining:[`At the table he always takes, with a second glass poured and untouched.`,`Turning the pages of an appointment book he does not appear to read.`],corridor:[`Standing where he can see the dining car door without being in it.`,`Walking back from the far end with nothing to have gone there for.`],cabin:[`The case he never opens, open, and closed again before the door is.`],vestibule:[`Between the cars in the noise, checking his watch against the carriage clock.`],platform:[`First of the through passengers, greeted by the guard by name.`]},lede:`The only passenger aboard since Paris, and the only one the guard greets by name.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Travelling clothes worn comfortable, a sample case he never opens, and the calm of a man who has made this run forty times.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Whatever account he gives, the steward confirms it without being asked, and that is the trouble with it. A man known to the staff by name is a man whose evening comes with witnesses already prepared.`],bullets:[]},the_appointment_book:{heading:`The Appointment Book`,paragraphs:[`Tonight's page carries a single entry at half past eight, in a hand that is not his, and the page before it has been removed.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He is the only passenger with no reason to be nervous, and he is nervous.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`Comfortable, the way a man is who has made the run forty times, and the calm has not entirely left him. The appointment book was under him rather than on him, which takes putting there.`,`Tonight's page is still the page it was open at. The page before it is still missing.`],bullets:[]}},source:`shared/data/passengers/dupont.mdx`},{id:`halloran`,name:`Seamus Halloran`,listed:`Mr. Halloran`,role:`Company engineer, riding on a pass`,berth:`Guard's van, no berth`,boarded:{at:`18:15`,where:`Calais`},location:`guard_van`,traits:[`travels on a pass and pays for nothing`,`carries a bag of tools he has not opened`,`was not expected aboard by anybody who keeps a list`],relationships:[{who:`moreau`,tie:`Signed him aboard on a pass and did not enter it in the register.`},{who:`marchand`,tie:`Has been told twice to keep away from the crate, and has been near it twice.`}],alibis:[{says:[`Says he was in the van with his bag from nine, where a pass puts a man`,`Says the guard knows he is aboard and signed nothing to say so`,`Says he did not go forward at all, having no reason to`],claims:[{where:`guard_van`,never:!1,from:`21:00`}]},{says:[`Says he stood between the cars listening to the coupling`,`Says there is a knock in it that will be somebody's derailment by Vienna`,`Says he was out there from ten and would have felt anybody pass`],claims:[{where:`vestibule`,never:!1,from:`22:00`}]},{says:[`Says he walked the corridor from half past eight checking the window frames`,`Says the company does not pay him to sit still on a pass`,`Says he was never once in the van, whatever the guard has written`],claims:[{where:`corridor`,never:!1,from:`20:30`},{where:`guard_van`,never:!0}]}],sightings:{mail:[`In the mail van, which the guard cannot open, without having said how he did.`],kitchen:[`Behind the range with a lamp, looking at pipework that is not his to look at.`],guard_van:[`Sitting on his own toolbag with his back against the crate.`,`In the van with the door pulled to, which is not how the guard leaves it.`],vestibule:[`Between the cars with his ear to the concertina wall, not moving.`,`Out in the noise where nobody stands unless they mean to.`],corridor:[`Running a thumb along a window frame and finding nothing wrong with it.`],platform:[`Boarding at Calais without a ticket and without being stopped.`]},lede:`A company engineer nobody sent for, riding on a pass that lets him aboard any train on the line and obliges him to explain himself on none of them.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Working clothes under a good coat that does not belong with them, and hands that have been cleaned recently and thoroughly enough to be remarked on.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Whatever he says he was doing, it is company business, and company business is the one account aboard that cannot be checked by anybody riding as a passenger.`],bullets:[]},the_toolbag:{heading:`The Toolbag`,paragraphs:[`He has carried it since Calais and has not opened it. A man who is aboard to work opens his bag; a man who is aboard to be seen carrying one does not.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He is the only person aboard whose name is on no list -- not the manifest, not the register, not the reservation book. The pass is real. The company has no record of issuing it to anybody travelling tonight.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`In the good coat rather than the working clothes, which is the wrong way round for a man who says he was working. The hands are clean.`,`The toolbag is beside him, and it is open, and there is nothing in it that a railwayman would carry.`],bullets:[]}},source:`shared/data/passengers/halloran.mdx`},{id:`marchand`,name:`Dame Ysolde Marchand`,listed:`Dame Marchand`,role:`Sworn of the Order of the Kept Flame, escorting cargo to Constantinople`,berth:`Car No. 7, berth 2`,boarded:{at:`18:15`,where:`Calais`},location:`guard_van`,traits:[`travels armoured under a travelling cloak`,`will not be parted from the guard's van key`,`answers questions about the cargo with the same sentence each time`],relationships:[{who:`moreau`,tie:`Made him sign her crate aboard, and has asked him twice since who else has a key.`},{who:`beaumont`,tie:`Boarded at the same platform, and each has been at pains to say they did not.`}],alibis:[{says:[`Says she did not leave the guard's van at all, before eleven or after it`,`Says the crate was sealed at Calais and has not been opened since`,`Says she has never met Lady Beaumont`],claims:[{where:`guard_van`,never:!1}]},{says:[`Says she walked the length of the train once, slowly, and once only`,`Says she was looking at doors rather than at people`,`Says she has never entered a sleeping compartment on this service`],claims:[{where:`corridor`,never:!1,from:`22:00`},{where:`cabin`,never:!0}]},{says:[`Says she was relieved at the van at eleven and took her rest`,`Says the oath permits it and the rota requires it`,`Says the key did not leave her while she slept`],claims:[{where:`cabin`,never:!1,from:`23:00`}]}],sightings:{mail:[`Standing the length of the mail van from the seal, watching it and not approaching.`],guard_van:[`Seated with the crate, in the one room aboard nobody else may enter.`,`Not dining, not reading, and not once looking away from the cargo.`],corridor:[`Walking it once, slowly, looking at doors rather than at people.`,`Mail showing at the wrist where the travelling cloak has fallen open.`],cabin:[`Still dressed, with the door unlocked behind her, which is not carelessness.`],platform:[`Behind a crate that takes four men to lift, and is signed for without reading.`]},lede:`An order that has not existed on any map since the crusades, travelling first class with a crate nobody is permitted to open.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`A travelling cloak over mail that shows at the wrist, and the flat calm of someone who has been in a fight and expects another.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Her account is whatever the oath permits her to give, and no part of it can be checked by anybody aboard. She offers it without impatience, as though the impossibility of confirming it were somebody else's difficulty.`],bullets:[]},the_warrant:{heading:`The Warrant`,paragraphs:[`Sealed in wax that is not any nation's, countersigned by a house that fell four hundred years ago, and honoured at Calais without a word.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`The only passenger armed, the only passenger with a reason to be, and the only one whose story cannot be broken because nothing about it can be checked.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`Under the travelling cloak the mail is intact, unpierced, and did not fail. She was not killed through her armour, which narrows it to somebody she let close enough not to need to be.`,`The guard's van key is not on her, and it was never off her.`],bullets:[]}},source:`shared/data/passengers/marchand.mdx`},{id:`moreau`,name:`Gaspard Moreau`,listed:`The Guard`,role:`Conductor of Car No. 7, thirty years on the line`,berth:`Guard's van, no berth`,boarded:{at:`16:05`,where:`Paris`},location:`corridor`,traits:[`holds a key to every door on the train`,`marks the register at every stop`,`has walked this corridor ten thousand times`],relationships:[{who:`dupont`,tie:`Greets him by name, and has done since before either had grey in his hair.`},{who:`marchand`,tie:`Signed her cargo aboard at Calais without reading what the warrant said.`}],alibis:[{says:[`Says he turned the lamps down at ten, as the book requires`,`Says he was in the van from that hour, with the door locked`,`Says he saw no one in the corridor who had no business in it`],claims:[{where:`guard_van`,never:!1,from:`22:00`}]},{says:[`Says he walked the train all night and never sat down once`,`Says thirty years on the line is thirty years of not sitting down`,`Says the van was locked the whole while and he did not go in`],claims:[{where:`corridor`,never:!1,from:`21:00`},{where:`guard_van`,never:!0}]},{says:[`Says he was marking the register at the service end of the dining car`,`Says he counted the tables twice because the count was wrong once`,`Says he was there from half past ten until he was fetched`],claims:[{where:`dining`,never:!1,from:`22:30`}]}],sightings:{mail:[`At the mail van door with the wrong key in his hand, and no right one.`],kitchen:[`Fastening the kitchen door, which fastens and does not lock.`],corridor:[`Door to door as the light goes, the way he has ten thousand times.`,`Turning the lamps down, and stopping at one door longer than the rest.`],dining:[`Standing at the service end, watching the room rather than the meal.`,`Marking the register against a table he has already counted twice.`],guard_van:[`Between walks, with the register open and the strongbox behind him.`,`Sitting with the door locked, which he says is where the key stays.`],vestibule:[`Between the cars where the noise is, listening to it rather than through it.`],platform:[`Taking the register and handing up the last of the luggage himself.`]},lede:`Thirty years of this corridor, and the only man aboard who is paid to notice everything.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`The company's dark blue, worn to the shine at the elbows, and a chain of keys that announces him a carriage before he arrives.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`He gives his account the way he marks the register: completely, in order, and with one thing left out. Thirty years of being the man who noticed is thirty years of choosing what to say he noticed.`],bullets:[]},the_register:{heading:`The Register`,paragraphs:[`Every passenger, every stop, in a copperplate hand that has not changed in thirty years. Tonight's page has one boarding entered out of order.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He is not a suspect and he knows it, which is why what he chooses not to say is worth more than anything the passengers volunteer.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`In the company's dark blue, worn to the shine at the elbows, and the chain of keys that announces him a carriage before he arrives is silent and still on it. Every key is there. He has said for thirty years that he holds the only one.`,`The register is open and the copperplate does not waver, including on the last line he wrote.`],bullets:[]}},source:`shared/data/passengers/moreau.mdx`},{id:`pryce`,name:`Alun Pryce`,listed:`The Steward`,role:`Dining car steward, Calais to the border`,berth:`Dining car, no berth`,boarded:{at:`16:05`,where:`Paris`},location:`dining`,traits:[`remembers what every passenger drinks`,`confirms other people's evenings without being asked`,`is never once asked about his own`],relationships:[{who:`dupont`,tie:`Confirms his evenings without being asked, and has for eleven years.`},{who:`moreau`,tie:`Company men both, and the only two aboard who are working.`}],alibis:[{says:[`Says he was at the service end from eight until the last cover went out`,`Says he cleared, laid up for the morning, and did not sit down`,`Says he can account for every passenger who dined, and does`],claims:[{where:`dining`,never:!1,from:`20:00`}]},{says:[`Says the car was empty by ten and he had the corridor to walk`,`Says he was carrying linen forward, which is a steward's work at that hour`,`Says he was never behind the service screen after the lamps went down`],claims:[{where:`corridor`,never:!1,from:`22:00`},{where:`dining`,never:!0}]},{says:[`Says the stores are in the van and he was signing for the morning's bread`,`Says the guard let him in and the guard will say so`,`Says he was there past eleven and lost the hour entirely`],claims:[{where:`guard_van`,never:!1,from:`23:00`}]}],sightings:{kitchen:[`At the range with it long out, doing nothing that needs a range.`,`Counting the plate back into the lockbox, twice.`],salon:[`Carrying through to the salon and staying longer than the tray needed.`,`Turning the salon lamps up, which is done at nine and was done at eleven.`],dining:[`At the service end, watching the room rather than the covers.`,`Laying up for a breakfast this train will not be serving.`],corridor:[`Carrying linen forward with both arms, which is a reason to be anywhere.`,`Stopped outside a door with the linen, and not moving.`],guard_van:[`Signing the stores book in a hand that is not steady tonight.`],platform:[`Boarding with the crew an hour before anybody was let aboard.`]},lede:`The man who confirms everybody else's evening, and whose own nobody has thought to ask about.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`The company's white jacket, pressed this morning and still pressed, and the flat attentive face of somebody who has spent twenty years being spoken past.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Whatever account he gives is the account of a man who was working, which is the one alibi aboard that explains being everywhere. He has not been pressed on it, because he is the one being asked about everybody else.`],bullets:[]},what_he_pours:{heading:`What He Pours`,paragraphs:[`He remembers what every passenger drinks and volunteers it before he is asked, which has so far been taken for helpfulness. He has not once been asked what he himself had, and the answer is that the service brandy is three measures down.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He is the only person aboard whose testimony is taken as corroboration rather than as evidence, and the difference has not been examined.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`In the white jacket, pressed this morning and no longer pressed. The cloth over one arm is folded the way he folds it, which means he was working when it stopped.`,`Nobody thought to ask him anything all evening, and now there is a queue of questions with nowhere to go.`],bullets:[]}},source:`shared/data/passengers/pryce.mdx`},{id:`rennick`,name:`Edward Rennick`,listed:`Mr. Rennick`,role:`Bank courier, London, will not take a berth`,berth:`Berth reserved, not taken up`,boarded:{at:`18:52`,where:`Calais`},location:`corridor`,traits:[`is chained to a case at the wrist`,`reserved a berth and has not been in it`,`will not sit with his back to a door`],relationships:[{who:`marchand`,tie:`Two people aboard escorting something, and each has priced the other's escort.`},{who:`thompson`,tie:`Was asked his business by him twice, and gave a different answer each time.`}],alibis:[{says:[`Says he was in the corridor from nine and stayed on his feet`,`Says a courier does not sleep on the leg that matters`,`Says he saw everybody who passed and can name most of them`],claims:[{where:`corridor`,never:!1,from:`21:00`}]},{says:[`Says he took a table in the dining car where he could see both doors`,`Says he was there from ten and did not move from it`,`Says he was never in the corridor, where a man can be come at from two ends`],claims:[{where:`dining`,never:!1,from:`22:00`},{where:`corridor`,never:!0}]},{says:[`Says he stood in the vestibule from half past ten with his back to the wall`,`Says it is the only place aboard nobody can approach unheard`,`Says he did not take the berth he paid for and does not want it now`],claims:[{where:`vestibule`,never:!1,from:`22:30`}]}],sightings:{mail:[`At the sealed door of the mail van, not touching it, reading the seal.`],salon:[`In the corner seat with the case beside him and both doors in view.`],corridor:[`On his feet at the end of the car, facing the length of it.`,`Standing where two doors are in view and neither is behind him.`],dining:[`At the corner table with the case on the seat beside him, not on the floor.`,`Refusing the service and remaining at the table anyway.`],vestibule:[`Back to the concertina wall, where the approach is six feet and loud.`],cabin:[`At the door of berth 4, which is not the one he reserved.`],platform:[`Boarding last at Calais and standing aside to let the others go first.`]},lede:`A courier for a London bank, chained to a case at the wrist, who reserved a berth at Calais and has not once been in it.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`A plain suit that has been slept in and not slept in, a chain at the cuff, and the flat readiness of a man who has done this leg before and expects it to be the one.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Whatever he says he was doing, he was doing it standing, awake, and where he could see a door. That is either a professional habit or the description of somebody who knew what was coming.`],bullets:[]},the_case:{heading:`The Case`,paragraphs:[`Locked, chained, and never once set on the floor. He has been offered the guard's van for it twice, by two different people, and has refused both without appearing to consider it.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He paid for a berth he has not used, which means there is a made-up bed aboard this train that nobody has been in and nobody has been watching.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`The chain is still at the wrist and the case is still on the chain, which is the first thing anybody checked and the wrong thing to have found.`,`Whatever this was, it was not the case. He was facing whoever it was, the way he has faced every door since Calais.`],bullets:[]}},source:`shared/data/passengers/rennick.mdx`},{id:`thompson`,name:`Edward Thompson`,listed:`Mr. E. Thompson`,role:`Grain factor, of Norwich`,berth:`Car No. 7, berth 3`,boarded:{at:`18:40`,where:`Calais`},location:`dining`,traits:[`describes his business twice and differently`,`dines early and alone`,`asks about the timetable`],relationships:[{who:`dupont`,tie:`Shared a table by chance, or says it was chance.`}],alibis:[{says:[`Says he was asleep by ten`,`Says he heard the guard and nothing before it`,`Says he has never travelled this line before`],claims:[{where:`cabin`,never:!1,from:`22:00`},{where:`vestibule`,never:!0}]},{says:[`Says he stood in the vestibule most of the evening for the air`,`Says a man from Norwich is not troubled by a draught`,`Says nobody could have heard a word said out there, including his`],claims:[{where:`vestibule`,never:!1,from:`21:00`}]},{says:[`Says he dined late and stayed later`,`Says he was putting a question to anybody who would sit down`,`Says he never went near his berth until well past midnight`],claims:[{where:`dining`,never:!1,from:`21:30`},{where:`cabin`,never:!0}]}],sightings:{salon:[`Putting his question to a third person, who is also declining to answer it.`],cabin:[`The lamp out early, and the case with the forced lock pushed under the berth.`,`Dressed, on the made bed, with his boots still on.`],dining:[`Dining before the service properly opens, alone, facing the door.`,`Describing his business to a steward who did not ask.`],corridor:[`Walking as though he has counted the doors and would rather not be seen doing it.`],vestibule:[`At the door between the cars, looking at the ground going past.`],platform:[`Boarding with one case and no trunk, and no porter needed.`]},lede:`A grain factor from Norwich, travelling on business he describes twice and differently.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`A good coat kept too long, boots newly resoled, and a case with a lock that has been forced and repaired.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`He offers his evening in more detail than was asked for, and offers it again if the conversation goes quiet. A man from Norwich has a great deal to say about where he has been.`],bullets:[]},the_question_he_asked:{heading:`The Question He Asked`,paragraphs:[`He asked the steward whether the train stops between halts. Told that it does not, he said nothing further, and did not look surprised.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`The lock on his case was forced from the inside.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`Heavier than a grain factor of Norwich has any business being, and he went down where he stood rather than where he was moving. Whatever he was asked, he had stopped to answer it.`,`The question he had been putting to people all evening he did not get to put again.`],bullets:[]}},source:`shared/data/passengers/thompson.mdx`},{id:`vasek`,name:`Ilya Vasek`,listed:`Entered as "I. Vasek"`,role:`Passenger of berth 7, occupation not entered`,berth:`Car No. 7, berth 7`,boarded:{at:`16:05`,where:`Paris`},location:`cabin`,traits:[`boarded at Paris and was written down at Calais`,`carried no trunk and gave no occupation`,`spoke to three people, and each says it was the only time`],relationships:[{who:`dupont`,tie:`The half past eight entry in the appointment book is in his hand.`},{who:`moreau`,tie:`His is the boarding entered out of order in tonight's register.`},{who:`marchand`,tie:`Never spoke to her. She has asked twice who else holds a key.`}],alibis:[{says:[`Says he went to his berth at half past nine and did not come out`,`Says he took no dinner and wanted none`,`Says he did not hear the corridor, which is a yard from his door`],claims:[{where:`cabin`,never:!1,from:`21:30`},{where:`dining`,never:!0}]},{says:[`Says he was in the corridor from ten, standing`,`Says he was waiting for somebody who knew he was waiting`,`Says he did not knock, because he was not sure of the door`],claims:[{where:`corridor`,never:!1,from:`22:00`}]},{says:[`Says he stood between the cars where the noise is`,`Says he was not spoken to and did not speak`,`Says it is the only place aboard where a man is left alone`],claims:[{where:`vestibule`,never:!1,from:`21:00`}]}],sightings:{salon:[`Standing at the back of the salon where the lamplight does not reach the wall.`],platform:[`Boarding at Paris among the through passengers, and noticed by nobody.`],corridor:[`Standing outside a door without knocking at it.`,`Passing the length of the car once, and not coming back that way.`],vestibule:[`Between the cars, where the noise covers whatever is being said.`,`Waiting, in the one place aboard where waiting is not remarked on.`],dining:[`At the door of the dining car at the half hour, not going in.`],cabin:[`Berth 7, made up for one, with the window latch turned the wrong way.`]},lede:`The passenger nobody has mentioned, in the berth between Mr. Thompson's and the one on the player's ticket.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`A coat bought for a colder country, boots that have walked further than this journey, and hands the doctor would call a labourer's if he were asked, which he has not been.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`He gives an account, and there is nobody at all to say whether it is true. He spoke to three people the whole journey and each says it was the only time.`],bullets:[]},the_berth:{heading:`The Berth`,paragraphs:[`Berth 7 is made up for one. The lamp is out, which the guard says he did not do, and the window latch is turned to a position the guard says he has never found it in on any run in thirty years.`],bullets:[]},what_the_register_says:{heading:`What the Register Says`,paragraphs:[`His boarding is entered in Moreau's copperplate between two Calais names, an hour and fifty minutes after the platform it names. The hand does not waver at the place where it lies.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`The Order's record says what he was, and the record is not open to reading. If it says goblin, then by the fourth clause no crime has been committed aboard this train, and every question after that one is a formality.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`The coat bought for a colder country is still buttoned to the throat. The hands the doctor would call a labourer's are unmarked, which is the difficulty: a man who worked with his hands did not raise them.`,`The Order's record says what he was and the record is not open to reading. If it says goblin then by the fourth clause there is no body here at all, only an object, and the enquiry is a formality being conducted over furniture.`],bullets:[]}},source:`shared/data/passengers/vasek.mdx`},{id:`weiss`,name:`Doctor Heinrich Weiss`,listed:`Dr. H. Weiss`,role:`Physician, of Vienna`,berth:`Car No. 7, berth 5`,boarded:{at:`18:52`,where:`Calais`},location:`corridor`,traits:[`offers help before it is asked for`,`watches the corridor, not the window`,`carries his case everywhere`],relationships:[{who:`beaumont`,tie:`Greeted her at the barrier; now says they have never met.`},{who:`thompson`,tie:`Dined at the next table and left when Thompson did.`}],alibis:[{says:[`Says he was in his compartment until midnight with the bag`,`Says he walked the corridor after it because he could not sleep`,`Says a physician sleeps badly on trains and always has`],claims:[{where:`cabin`,never:!1,until:`00:00`},{where:`corridor`,never:!1,from:`00:00`}]},{says:[`Says he sat in the dining car from nine with the book open`,`Says he was writing up the day, which the book does not show`,`Says he did not go forward past the corridor at any point`],claims:[{where:`dining`,never:!1,from:`21:00`}]},{says:[`Says he stood in the vestibule from ten for the air`,`Says he was not well and did not want to be seen not being well`,`Says he was never in his compartment before the small hours`],claims:[{where:`vestibule`,never:!1,from:`22:00`},{where:`cabin`,never:!0}]}],sightings:{salon:[`At the far table with the bag at his feet, watching the door rather than the room.`],corridor:[`At the far end, in the dark, fully dressed at an hour that wants explaining.`,`Walking towards a sound rather than away from one.`],dining:[`Taking coffee he does not drink, at the table nearest the passage.`,`Leaving when the man at the next table leaves.`],cabin:[`The case open on the berth, and closed at the sound of the handle.`,`Awake with the lamp lit, and the door watched rather than the window.`],vestibule:[`Between the cars, cleaning his spectacles in the one place nobody passes.`],platform:[`Boarding last, after the general call, carrying the case himself.`]},lede:`A physician, he says, of Vienna, though his case holds instruments no physician carries.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Grey at the temples, spectacles he cleans when asked a direct question, and a coat too heavy for a heated carriage.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`A physician's account, given precisely, with the times to the quarter hour and not one of them rounded. He has clearly thought about how it will sound, which is not the same as having invented it.`],bullets:[]},the_case:{heading:`The Case`,paragraphs:[`Brass fittings, Viennese maker's mark, and a tray of instruments too fine for surgery and too sharp for anything else. He does not let a porter carry it.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`He asked whether help was wanted before anyone aboard had said that anything was wrong.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`The bag is beside him, open, and the book in it records what was poured and when in his own hand up to an entry he did not finish. The pen is capped.`,`A physician of Vienna knows what is fatal and in what quantity, which is worth nothing at all to him now and a great deal to whoever is asked about it.`],bullets:[]}},source:`shared/data/passengers/weiss.mdx`},{id:`zsofia`,name:`Zsófia Rédey`,listed:`Mme Rédey`,role:`Singer, engaged at Budapest, travelling without a sleeper`,berth:`No berth taken`,boarded:{at:`18:48`,where:`Calais`},location:`dining`,traits:[`travels with four trunks and no sleeper`,`is recognised by two passengers and acknowledged by neither`,`answers in whichever language the question was not asked in`],relationships:[{who:`beaumont`,tie:`Recognised her at Calais and was not recognised in return, which both noticed.`},{who:`weiss`,tie:`Consulted him about her throat before either had said their name.`}],alibis:[{says:[`Says she sat in the dining car all evening because there is nowhere else`,`Says she does not sleep on trains and did not attempt it`,`Says the steward will confirm she never left the table`],claims:[{where:`dining`,never:!1,from:`21:00`}]},{says:[`Says she stood between the cars because a voice needs air and the car had none`,`Says she was out there from half past ten and stayed out`,`Says she was not once in the dining car after the service closed`],claims:[{where:`vestibule`,never:!1,from:`22:30`},{where:`dining`,never:!0}]},{says:[`Says she walked the corridor from eleven, back and forth, the way one does`,`Says she was working through a part and cannot do that sitting down`,`Says she passed the same doors a great many times and looked at none of them`],claims:[{where:`corridor`,never:!1,from:`23:00`}]}],sightings:{salon:[`Given the good chair by somebody, and not sitting in it.`,`Singing quietly to the window, which is the only audience she has had since Calais.`],dining:[`At a table laid for two, with one cover cleared unused.`,`Singing under her breath in a language nobody at the next table has.`],vestibule:[`Between the cars with her head back against the wall, breathing.`,`Out in the noise, where a voice can be used and not heard.`],corridor:[`Walking the length of it and turning at the end without pausing.`,`Stopped at a window, watching the dark rather than anything in it.`],platform:[`Boarding late at Calais with more luggage than a berthless passenger needs.`]},lede:`Engaged at Budapest, travelling to it with four trunks and no berth, which is either economy or a decision to be somewhere she can be seen all night.`,body:[],sections:{appearance:{heading:`Appearance`,paragraphs:[`Travelling clothes chosen to be looked at, a scarf kept on indoors, and the particular stillness of somebody who has been taught to be still on a stage.`],bullets:[]},alibi:{heading:`Alibi`,paragraphs:[`Whatever account she gives, it is an account of somebody with nowhere private to be, and a passenger with no berth cannot be alone anywhere aboard.`],bullets:[]},the_trunks:{heading:`The Trunks`,paragraphs:[`Four, all in the van, all opened at Calais by a customs man who signed for three. She has asked the guard twice when the van is unlocked and been told twice that it is not.`],bullets:[]},under_enquiry:{heading:`Under Enquiry`,paragraphs:[`She has no compartment, which means she has no door, which means she is the only passenger aboard whose whereabouts anybody could have observed all night. Nobody did.`],bullets:[]},the_body:{heading:`The Body`,paragraphs:[`The scarf is off, which nobody aboard has seen before tonight, and it is not anywhere near her.`,`She was engaged at Budapest for a season beginning in eleven days, and the company there has been told to expect her, and has not yet been told anything else.`],bullets:[]}},source:`shared/data/passengers/zsofia.mdx`}],items:[{id:`brass_key`,name:`Brass Key`,kind:`key`,carried:!0,reveals:[`the_number_belongs_to_another_carriage`],lede:`Small, worn bright at the bow, and stamped with a number that belongs to no berth in this carriage.`,body:[],sections:{markings:{heading:`Markings`,paragraphs:[`Number 14, and this carriage ends at 8. The stamping is old; the wear on the bow is not.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`It was in the player's coat before Calais, and the player does not remember putting it there.`],bullets:[]}},source:`shared/data/items/brass_key.mdx`},{id:`carriage_lamp`,name:`Carriage Lamp`,kind:`weapon`,carried:!1,reveals:[`a_lamp_was_off_its_bracket_before_the_lamps_went_down`],lede:`Brass, weighted in the base so it stands when the car sways, and heavy enough in the hand that nobody carries one further than the next bracket.`,body:[],sections:{the_base:{heading:`The Base`,paragraphs:[`A dent in the rim that the company's fitter did not put there, and a smear inside the dent that has been wiped at rather than cleaned.`],bullets:[]},the_bracket:{heading:`The Bracket`,paragraphs:[`Every lamp on the train sits in a bracket, and the brackets are numbered. One lamp is in a bracket that is not the one stamped on it.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Railway property again, in a train full of it. The guard turns them down at ten and does not count them, because in thirty years there has never been a reason to.`],bullets:[]}},source:`shared/data/items/carriage_lamp.mdx`},{id:`escort_axe`,name:`Hand Axe`,kind:`weapon`,carried:!1,model:`escort_axe`,reveals:[`the_crate_was_opened_by_something_and_this_is_what_opens_crates`],lede:`Short-hafted, single-bitted, and the one thing in the van that has an honest reason to be there: a crate is opened with an axe or it is not opened.`,body:[],sections:{the_bit:{heading:`The Bit`,paragraphs:[`Bright along the edge and dulled at the heel, which is wear from prying rather than from cutting.`],bullets:[]},the_haft:{heading:`The Haft`,paragraphs:[`Wrapped where a hand goes, and the wrapping is newer than the wear under it.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Railway tool or the Order's, depending on who is asked, and the two answers have been given by two people about the same axe.`],bullets:[]}},source:`shared/data/items/escort_axe.mdx`},{id:`escort_dagger`,name:`Escort's Dagger`,kind:`weapon`,carried:!1,model:`escort_dagger`,reveals:[`the_order_carries_arms_it_has_not_declared`],lede:`Plain, short, and issued rather than chosen: one of four the same, worn under the cloak where a coat would hide it.`,body:[],sections:{the_blade:{heading:`The Blade`,paragraphs:[`No maker's mark and no ornament. The Order does not commission, it equips, and what it equips is the cheapest thing that will do the work.`],bullets:[]},the_sheath:{heading:`The Sheath`,paragraphs:[`Sewn to the belt rather than hung from it, which is how a thing is carried by somebody expecting to need it in a corridor.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Not on the manifest. Nothing the escort carries is on the manifest, and the warrant is why nobody at Calais asked.`],bullets:[]}},source:`shared/data/items/escort_dagger.mdx`},{id:`escort_hammer`,name:`War Hammer`,kind:`weapon`,carried:!1,model:`escort_hammer`,reveals:[`the_order_travels_equipped_for_something_it_will_not_name`],lede:`A head of steel on a short haft, weighted so far forward that it is useless for anything except what it is for.`,body:[],sections:{the_head:{heading:`The Head`,paragraphs:[`Faced on one side and spiked on the other, and the spike has been ground back to a stub by somebody who wanted it to look like a mallet.`],bullets:[]},why_it_is_aboard:{heading:`Why It Is Aboard`,paragraphs:[`Nobody has offered a reason. Dame Marchand answers questions about the cargo with the same sentence each time, and this is not the cargo.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Under the same warrant as the rest, sealed in wax that is not any nation's.`],bullets:[]}},source:`shared/data/items/escort_hammer.mdx`},{id:`escort_sword`,name:`Arming Sword`,kind:`weapon`,carried:!1,model:`escort_sword`,reveals:[`a_blade_too_long_to_draw_in_a_corridor_was_drawn_somewhere`],lede:`A yard of straight steel, which is a yard more than the width of the corridor it would have to be swung in.`,body:[],sections:{the_blade:{heading:`The Blade`,paragraphs:[`Sharpened along its whole length and lately, by somebody who did the work in a hurry and left the stone's grit in the fuller.`],bullets:[]},where_it_was:{heading:`Where It Was`,paragraphs:[`Racked in the guard's van with three others, in a stand made for four. The leather at one station is compressed and at the rest it is not.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`The Order's, under warrant, and the only weapon aboard that could not be concealed by anybody carrying it anywhere.`],bullets:[]}},source:`shared/data/items/escort_sword.mdx`},{id:`laudanum`,name:`Bottle of Laudanum`,kind:`weapon`,carried:!1,owner:`weiss`,reveals:[`the_physician_dispenses_to_somebody_aboard`,`the_bottle_is_lighter_than_the_book_says`],lede:`Tincture of opium, dispensed in Vienna, in a brown bottle with a measure marked down the side.`,body:[],sections:{the_measure:{heading:`The Measure`,paragraphs:[`The book in the doctor's bag records what was poured and when. The bottle is three doses lighter than the book has an entry for.`],bullets:[]},who_it_is_for:{heading:`Who It Is For`,paragraphs:[`The label carries a name that is not Dr. Weiss's and not any name on the passenger list, in handwriting that is his.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Declared at Calais as medical, which it is, and which is the reason nobody looked at how much of it there was.`],bullets:[]}},source:`shared/data/items/laudanum.mdx`},{id:`luggage_strap`,name:`Luggage Strap`,kind:`weapon`,carried:!1,reveals:[`one_strap_is_missing_from_the_van_and_one_is_not_where_it_hangs`],lede:`Six feet of harness leather with a brass buckle, of which the guard's van holds a dozen and the register accounts for eleven.`,body:[],sections:{the_leather:{heading:`The Leather`,paragraphs:[`Stretched along one section and nowhere else, the way leather goes when it has been pulled hard once rather than loaded often.`],bullets:[]},where_they_hang:{heading:`Where They Hang`,paragraphs:[`On a rail inside the van door, in a row, and the gap in the row is not at the end where a man reaching in a hurry would take one from.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Railway property, unremarkable, and the only thing aboard that could kill a man without anybody having brought it.`],bullets:[]}},source:`shared/data/items/luggage_strap.mdx`},{id:`ornate_dagger`,name:`Ornate Dagger`,kind:`weapon`,carried:!1,model:`ornate_dagger`,reveals:[`the_blade_left_its_sheath_before_the_border`,`somebody_walked_the_length_of_the_train_to_put_it_here`],lede:`A hand's length of blade, chased along the spine and fitted to a sheath it is no longer in. Both are on the floor of the van, a foot apart, past the crates and under the window, where the light does not reach.`,body:[],sections:{the_blade:{heading:`The Blade`,paragraphs:[`Ornamental, and sharpened anyway. The chasing runs to the edge and stops, the way a maker's work does when the edge is meant to be honed and the pattern is not meant to be worn away.`,`It has been wiped. Not cleaned -- wiped, once, along one face, by somebody in more of a hurry than the wiping was worth.`],bullets:[]},the_sheath:{heading:`The Sheath`,paragraphs:[`Lying open and empty, which is the part worth reading. A dagger dropped in a struggle keeps its sheath on a belt. A dagger drawn somewhere else and carried here arrives with the sheath in the other hand.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Nothing on the manifest matches it, and nothing in the van was opened to let it out. It came aboard in somebody's luggage and left that luggage before the border.`],bullets:[]}},source:`shared/data/items/ornate_dagger.mdx`},{id:`pocket_watch`,name:`Pocket Watch`,kind:`personal`,carried:!0,reveals:[],lede:`Silver, stopped, and running eleven minutes behind the carriage clock when last it ran.`,body:[`The case holds a portrait that has been cut down to fit, and cut badly.`],sections:{},source:`shared/data/items/pocket_watch.mdx`},{id:`service_revolver`,name:`Service Revolver`,kind:`weapon`,carried:!1,owner:`beaumont`,reveals:[`the_widow_travels_armed`,`one_chamber_was_fired_and_not_tonight`],lede:`Webley, service issue, and older than the marriage it came into. Carried in a travelling case fitted for it, which is not how a keepsake is carried.`,body:[],sections:{the_cylinder:{heading:`The Cylinder`,paragraphs:[`Six chambers, five loaded. The sixth has been fired and not cleaned since, and the fouling is old enough to be about some other evening entirely.`],bullets:[]},the_case:{heading:`The Case`,paragraphs:[`Lined in green baize with a recess cut for the revolver and a second recess, the same size, cut for something that is not in it.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Sir Rupert's, entered on no declaration at Calais. Lady Beaumont says she did not know it was in the luggage, and knows which case it is in.`],bullets:[]}},source:`shared/data/items/service_revolver.mdx`},{id:`telegram`,name:`Telegram`,kind:`document`,carried:!0,owner:`dupont`,reveals:[`dupont_travels_under_a_false_name`,`someone_knew_about_the_nine_oclock_service`],lede:`Handed aboard at Paris, folded twice, and addressed to a name that is not the one M. Dupont travels under.`,body:[],sections:{text:{heading:`Text`,paragraphs:[`It reads, in full: DO NOT DINE AT NINE.`],bullets:[]},provenance:{heading:`Provenance`,paragraphs:[`Filed at Paris at half past three, an hour before the train left, by a sender the clerk recorded only as "a lady".`],bullets:[`Filed 15:30, Paris`,`No sender name on the counterfoil`,`Delivered to the carriage, not the platform office`]}},source:`shared/data/items/telegram.mdx`},{id:`train_ticket`,name:`Train Ticket`,kind:`document`,carried:!0,reveals:[],lede:`Continental Express, Calais to the border, berth 4 of Car No. 7.`,body:[`The clerk's hand has corrected the berth number once, and the correction is initialled by nobody.`],sections:{},source:`shared/data/items/train_ticket.mdx`}],notices:[{id:`goblins`,title:`Goblins Are Banned`,image:`banner-goblins`,carriage:1,along:2.35,side:-1,above:1.95,width:1.1,lede:`The strip is printed in the red the Gazette keeps for losses and warnings, which is the Order's way of saying this one is not a formality.`,body:[],sections:{the_rule:{heading:`The Rule`,paragraphs:[`Goblins are banned from the Northern Line. They will be slain by law, and the Order is held blameless in the carrying out of it.`],bullets:[]},what_nobody_says:{heading:`What Nobody Says`,paragraphs:[`No clause explains how a guard is to tell. In practice the question is settled by whoever is holding the lamp.`],bullets:[]}},source:`shared/data/notices/goblins.mdx`},{id:`order`,title:`Notice to Passengers`,image:`notice-order`,carriage:2,along:0,side:1,above:1.95,width:1,lede:`The full posting, by order of the Knights of the Northern Line, in the frame every carriage carries beside the third window.`,body:[],sections:{the_clauses:{heading:`The Clauses`,paragraphs:[],bullets:[`Elves not allowed without permits.`,`Goblins are banned, and will be slain by law.`,`The rear cars are reserved for the older bloods and are locked between stations.`,`The Order's word is the record, and the record is not open to reading.`]},what_nobody_says:{heading:`What Nobody Says`,paragraphs:[`The fourth clause is the one that matters. Everything the other three claim rests on a record no passenger is permitted to check.`],bullets:[]}},source:`shared/data/notices/order.mdx`},{id:`permits`,title:`Elves Not Allowed Without Permits`,image:`banner-permits`,carriage:0,along:-2.35,side:1,above:1.95,width:1.1,lede:`Posted at Aldermoor and pasted in every carriage before the train left the platform.`,body:[],sections:{the_rule:{heading:`The Rule`,paragraphs:[`Permits are issued at Aldermoor and nowhere else on this line. A permit names one journey, one direction, and one carriage, and the guard is entitled to ask for it at any point between stations.`],bullets:[]},what_nobody_says:{heading:`What Nobody Says`,paragraphs:[`The permit office at Aldermoor keeps no evening hours. Anyone who boards after dark boards without one.`],bullets:[]}},source:`shared/data/notices/permits.mdx`}]},et=$e.gazette,tt=et.masthead,nt=et.standing,rt=et.plate,it=$e.locations,at=$e.articles,ot=$e.passengers,st=$e.items,ct=$e.notices,lt=e=>it.find(t=>t.id===e)?.name??e.replace(`_`,` `),ut=e=>e.listed??e.name,dt=()=>st.filter(e=>e.carried),ft=e=>ct.find(t=>t.id===e)??null,pt=(e,t)=>e.sections[t]??null,mt=e=>{let[t,n]=e.split(`:`).map(Number);return t*60+n};function ht(e,
