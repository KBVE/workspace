# Fish and Chip Adventures: a Phaser game mounted inside a React root, built by
# Vite into a static bundle. The publish target is an itch.io HTML page, which
# is why vite.config.ts pins `base: './'` -- itch serves the build from a
# hashed subdirectory, so absolute asset paths 404 there.
#
# Ported from the legacy Nx workspace, where the build wrote straight into a
# sibling site's public/embed directory. It writes to its own dist/ here: the
# itch upload and any embed both take the same artifact, rather than the build
# knowing about its consumers.
layer: 'application'
language: 'typescript'
stack: 'frontend'
tags: ['phaser', 'game', 'itch']

owners:
  defaultOwner: '@h0lybyte'

# The one thing the project graph cannot answer: the itch page slug lives on
# itch, not in this repository, and this project ships to a page called
# `fishchip`. Declared here so the publish task inherited from the 'itch' tag
# needs no per-game entry in a shared file.
env:
  ITCH_TARGET: 'kbve/fishchip:html'

fileGroups:
  sources:
    - 'src/**/*'
    - 'public/**/*'
    - 'index.html'
  configs:
    - 'vite.config.ts'
    - 'tsconfig*.json'
    - 'package.json'

tasks:
  build:
    command: 'vite build'
    toolchains: ['node']
    inputs: ['@group(sources)', '@group(configs)']
    outputs: ['dist']

  dev:
    command: 'vite'
    toolchains: ['node']
    preset: 'server'

  typecheck:
    command: 'tsc --noEmit'
    toolchains: ['node']
    inputs: ['@group(sources)', '@group(configs)']

  test:
    command: 'vitest run'
    toolchains: ['node']
    inputs: ['@group(sources)', '@group(configs)']

  # Renders the tileset with every gid labelled on its tile. Picking a tile was
  # archaeology before this -- the buildings came out blue and the town was
  # fenced with sand pits, because the only way to see what a gid looked like
  # was to put it in the game.
  atlas:
    command: 'node tools/atlas.mjs'
    toolchains: ['node']
    options:
      cache: false
      runInCI: false

  # Playwright ships no browser with the npm package. Declared as a task so the
  # e2e task can depend on it rather than every caller remembering to run it.
  # --with-deps installs the system libraries a headless Chromium needs on a
  # Linux runner, and is a no-op on macOS.
  e2e-browser:
    command: 'playwright install --with-deps chromium'
    toolchains: ['node']
    options:
      cache: false

  # Boots the built game in a real browser, served from a path prefix the way
  # itch does -- the only check that proves the game starts at all.
  #
  # It runs in CI as well as before an itch release. `runInCI: false` would read
  # as "release-only", but moon skips such a task in any CI environment,
  # including when the release workflow asks for it by name, so the gate would
  # silently never run.
  e2e:
    command: 'playwright test'
    toolchains: ['node']
    deps:
      - '~:build'
      - '~:e2e-browser'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'e2e/**/*'
      - 'playwright.config.ts'
